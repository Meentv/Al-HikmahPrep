// Versioned, local-only storage. Validate at the boundary; retain old stable question IDs.
const Store = (() => {
  const KEY = 'hikmahprep.gns203.v5';
  const OLD = [
    'hikmahprep.gns203.v4',
    'hikmahprep.gns203.v3',
    'hikmahprep.v2',
    'hikmahprep.gns205.v1',
  ];
  const DEFAULT = {
    name: 'Student',
    theme: 'dark',
    goal: 10,
    cardGoal: 5,
    notifications: true,
    sound: false,
    collapsed: false,
  };
  const MAX_HISTORY = 600;
  const MAX_NOTES = 40;
  const MAX_NOTE_LENGTH = 8000;
  const noteBody = (value) =>
    typeof value === 'string'
      ? value
          .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, '')
          .slice(0, MAX_NOTE_LENGTH)
      : '';
  const kinds = ['quick', 'topic', 'saved', 'custom', 'full'];
  const list = (value) => (Array.isArray(value) ? value : []);
  const object = (value) => value && typeof value === 'object' && !Array.isArray(value);
  const validIds = (value, subject) =>
    H.unique(
      list(value).filter(
        (id) =>
          Number.isInteger(id) &&
          Catalog.get(id) &&
          (!subject || Catalog.get(id).subject === subject)
      )
    );
  const blank = () => ({
    version: 5,
    prefs: { ...DEFAULT },
    sessions: [],
    history: [],
    saved: [],
    savedTopics: [],
    collections: [],
    understood: [],
    flash: {},
    reviews: {},
    reminders: [],
    notes: [],
    read: [],
    awards: [],
  });
  const uniqueBy = (values, prop = 'id') => {
    const seen = new Set();
    return values.filter((item) => !seen.has(item[prop]) && !!seen.add(item[prop]));
  };

  function attempts(raw, completed = false) {
    if (!object(raw) || !H.token(raw.id) || (completed && !H.finiteTime(raw.completedAt)))
      return [];
    const ids = validIds(raw.ids);
    if (!ids.length) return [];
    const current = list(raw.ids)[H.int(raw.index, 0, Math.max(0, list(raw.ids).length - 1), 0)];
    const currentSubject = Catalog.get(current)?.subject;
    const keys = H.unique(ids.map((id) => Catalog.get(id).subject)).sort(
      (a, b) => Number(b === currentSubject) - Number(a === currentSubject)
    );
    const exam = raw.mode === 'mock' || raw.mode === 'exam';
    const duration = exam ? H.int(raw.duration, 60000, 10800000, ids.length * 60000) : 0;
    const savedMs = H.int(raw.remaining, 0, duration, duration);
    return keys.map((subject) => {
      const qs = ids.filter((id) => Catalog.get(id).subject === subject);
      const answers = Object.create(null);
      for (const id of qs) {
        const value = raw.answers?.[id];
        if (Number.isInteger(value) && value >= 0 && value < Catalog.get(id).options.length)
          answers[id] = value;
      }
      const mixed = keys.length > 1;
      const kind = kinds.includes(raw.kind)
        ? raw.kind
        : exam
          ? 'full'
          : raw.mode === 'topic'
            ? 'topic'
            : raw.mode === 'quick'
              ? 'quick'
              : 'custom';
      const splitTime = (number) =>
        mixed ? Math.round((number * qs.length) / ids.length) : number;
      return {
        id: mixed ? `${raw.id.slice(0, 80)}-${subject}` : raw.id,
        previousId: mixed ? raw.id : H.token(raw.previousId) ? raw.previousId : null,
        oldPaper: Catalog.courses[subject].legacyPaper || null,
        optionSeed: H.int(raw.optionSeed, 0, 4294967295, 0),
        subject,
        mode: exam ? 'exam' : 'practice',
        kind,
        ids: qs,
        answers,
        flags: validIds(raw.flags, subject).filter((id) => qs.includes(id)),
        index: qs.includes(current)
          ? qs.indexOf(current)
          : Math.max(
              0,
              qs.findIndex((id) => !Object.hasOwn(answers, id))
            ),
        createdAt: H.finiteTime(raw.createdAt)
          ? raw.createdAt
          : completed
            ? raw.completedAt
            : Date.now(),
        topic: Catalog.isTopic(subject, raw.topic) ? raw.topic : null,
        duration: exam ? Math.max(60000, splitTime(duration)) : 0,
        remaining: exam
          ? splitTime(
              mixed && H.finiteTime(raw.deadline)
                ? Math.max(0, Math.min(duration, raw.deadline - Date.now()))
                : savedMs
            )
          : 0,
        deadline:
          exam && !mixed && !completed && H.finiteTime(raw.deadline)
            ? Math.min(raw.deadline, Date.now() + duration)
            : null,
        ...(completed ? { completedAt: raw.completedAt, expired: Boolean(raw.expired) } : {}),
      };
    });
  }

  function clean(data) {
    const state = blank();
    if (!object(data)) return state;
    const pref = object(data.prefs) ? data.prefs : {};
    state.prefs = {
      name: H.text(pref.name).slice(0, 50) || DEFAULT.name,
      theme: ['light', 'dark', 'system'].includes(pref.theme) ? pref.theme : DEFAULT.theme,
      goal: H.int(pref.goal, 1, 120, DEFAULT.goal),
      cardGoal: H.int(pref.cardGoal, 1, 120, DEFAULT.cardGoal),
      notifications: pref.notifications !== false,
      sound: pref.sound === true,
      collapsed: pref.collapsed === true,
    };
    state.history = uniqueBy(
      list(data.history)
        .slice(0, MAX_HISTORY)
        .flatMap((a) => attempts(a, true))
    )
      .sort((a, b) => b.completedAt - a.completedAt)
      .slice(0, MAX_HISTORY);
    const historyIds = new Set(state.history.map((a) => a.id));
    const pending = Array.isArray(data.sessions)
      ? data.sessions
      : object(data.sessions)
        ? [data.sessions['205'], data.sessions['204']]
        : [data.active];
    state.sessions = uniqueBy(
      pending
        .slice(0, 16)
        .flatMap((a) => attempts(a))
        .filter((a) => !historyIds.has(a.id))
    );
    state.saved = validIds(data.saved);
    state.savedTopics = H.unique(
      list(data.savedTopics).filter((item) => {
        if (typeof item !== 'string') return false;
        const [s, t, tail] = item.split(':');
        return tail === undefined && Catalog.isTopic(s, t);
      })
    );
    state.collections = uniqueBy(
      list(data.collections)
        .slice(0, 24)
        .filter((c) => object(c) && H.token(c.id) && H.text(c.name))
        .map((c) => ({
          id: c.id,
          name: H.text(c.name).slice(0, 48),
          ids: validIds(c.ids).filter((id) => state.saved.includes(id)),
        }))
    );
    state.understood = validIds(data.understood);
    for (const subject of Catalog.keys) {
      const deck = data.flash?.[subject];
      if (!object(deck)) continue;
      const pool = validIds(deck.ids, subject);
      state.flash[subject] = {
        ids: pool,
        index: H.int(deck.index, 0, Math.max(0, pool.length - 1), 0),
        filter: ['all', 'hard', 'known'].includes(deck.filter) ? deck.filter : 'all',
      };
    }
    if (object(data.reviews)) {
      for (const day of Object.keys(data.reviews).filter(H.validDay).sort().slice(-400))
        state.reviews[day] = validIds(data.reviews[day]);
    }
    state.notes = uniqueBy(
      list(data.notes)
        .slice(0, MAX_NOTES)
        .filter((n) => object(n) && H.token(n.id))
        .map((n) => ({
          id: n.id,
          subject: Catalog.isCourse(n.subject) ? n.subject : null,
          title: H.text(n.title).slice(0, 80),
          body: noteBody(n.body),
          updated: H.finiteTime(n.updated) ? n.updated : Date.now(),
        }))
    ).sort((a, b) => b.updated - a.updated);
    state.reminders = uniqueBy(
      list(data.reminders)
        .slice(0, 32)
        .filter(
          (r) => object(r) && H.token(r.id) && H.validDay(r.day) && Catalog.isCourse(r.subject)
        )
        .map((r) => ({
          id: r.id,
          day: r.day,
          subject: r.subject,
          label: H.text(r.label).slice(0, 60) || 'Examination',
        }))
    );
    state.read = H.unique(list(data.read).filter(H.token)).slice(-120);
    state.awards = H.unique(list(data.awards).filter(H.token)).slice(-400);
    return state;
  }

  let available = true;
  let snapshot = null;
  let state = blank();
  try {
    snapshot = localStorage.getItem(KEY);
    for (const key of [KEY, ...OLD]) {
      const stored = localStorage.getItem(key);
      if (!stored) continue;
      try {
        const parsed = JSON.parse(stored);
        if (object(parsed)) {
          state = clean(parsed);
          break;
        }
      } catch {
        /* A damaged snapshot is not trusted. Try the prior save. */
      }
    }
    localStorage.setItem(`${KEY}.probe`, '1');
    localStorage.removeItem(`${KEY}.probe`);
  } catch {
    available = false;
  }

  function refresh() {
    if (!available) return false;
    try {
      const packed = localStorage.getItem(KEY);
      if (packed !== snapshot && packed !== null) {
        state = clean(JSON.parse(packed));
        snapshot = packed;
        return true;
      }
    } catch {
      /* Keep in-memory state when storage is inaccessible or corrupt. */
    }
    return false;
  }

  function change(update) {
    refresh();
    const result = update(state);
    if (available) {
      try {
        const packed = JSON.stringify(state);
        localStorage.setItem(KEY, packed);
        snapshot = packed;
      } catch {
        available = false;
      }
    }
    return result;
  }

  function clear(all = false) {
    change((s) => {
      const baseline = blank();
      if (!all)
        Object.assign(baseline, {
          prefs: s.prefs,
          saved: s.saved,
          savedTopics: s.savedTopics,
          collections: s.collections,
          reminders: s.reminders,
          notes: s.notes,
          read: s.read,
        });
      Object.assign(s, baseline);
    });
    for (const key of OLD) {
      try {
        localStorage.removeItem(key);
      } catch {
        /* No browser access. */
      }
    }
  }

  return {
    KEY,
    MAX_HISTORY,
    MAX_NOTES,
    MAX_NOTE_LENGTH,
    noteBody,
    get data() {
      return state;
    },
    get available() {
      return available;
    },
    change,
    refresh,
    clear,
  };
})();

// Derive every metric from submitted answer records or actual flashcard reviews.
const Stats = (() => {
  function grade(a) {
    let correct = 0,
      answered = 0;
    for (const id of a.ids)
      if (Object.hasOwn(a.answers, id)) {
        answered++;
        if (a.answers[id] === Catalog.get(id).answer) correct++;
      }
    return {
      correct,
      answered,
      wrong: answered - correct,
      blank: a.ids.length - answered,
      total: a.ids.length,
      percent: H.percent(correct, a.ids.length),
    };
  }
  function digest(history, subject = null, window = 'all') {
    const today = H.key();
    const from = window === 'all' ? '' : H.dayOffset(today, 1 - Number(window));
    const attempts = history.filter(
      (a) => (!subject || a.subject === subject) && (!from || H.key(a.completedAt) >= from)
    );
    const counts = { correct: 0, answered: 0, wrong: 0, unique: new Set(), topics: {}, daily: {} };
    for (const a of attempts) {
      const day = H.key(a.completedAt);
      const daily = (counts.daily[day] ||= { correct: 0, answered: 0, sessions: 0 });
      daily.sessions++;
      for (const id of a.ids) {
        if (!Object.hasOwn(a.answers, id)) continue;
        const q = Catalog.get(id);
        const record = (counts.topics[Catalog.topicKey(q.subject, q.topic)] ||= {
          subject: q.subject,
          topic: q.topic,
          answered: 0,
          correct: 0,
        });
        counts.unique.add(id);
        counts.answered++;
        daily.answered++;
        record.answered++;
        if (a.answers[id] === q.answer) {
          counts.correct++;
          daily.correct++;
          record.correct++;
        } else counts.wrong++;
      }
    }
    return {
      ...counts,
      attempts,
      accuracy: counts.answered ? H.percent(counts.correct, counts.answered) : null,
    };
  }
  function problematic(history, subject = null) {
    const last = new Map();
    const flagged = new Set();
    for (const a of history) {
      if (subject && a.subject !== subject) continue;
      for (const id of a.flags) flagged.add(id);
      for (const id of a.ids)
        if (Object.hasOwn(a.answers, id) && !last.has(id))
          last.set(id, a.answers[id] !== Catalog.get(id).answer);
    }
    return new Set(
      [...last]
        .filter(([, wrong]) => wrong)
        .map(([id]) => id)
        .concat([...flagged])
    );
  }
  function current(state = Store.data, digestAll = digest(state.history)) {
    const today = H.key();
    const active = (day) =>
      Boolean((digestAll.daily[day]?.answered || 0) + (state.reviews[day]?.length || 0));
    const todayAnswered = digestAll.daily[today]?.answered || 0;
    const todayCards = state.reviews[today]?.length || 0;
    const todaySessions = digestAll.daily[today]?.sessions || 0;
    let day = active(today) ? today : H.dayOffset(today, -1);
    let streak = 0;
    while (streak < 400 && active(day)) {
      streak++;
      day = H.dayOffset(day, -1);
    }
    const week = Array.from({ length: 7 }, (_, i) => {
      const day = H.dayOffset(today, i - 6);
      return { day, active: active(day), today: day === today };
    });
    return { today, todayAnswered, todayCards, todaySessions, streak, week };
  }
  const weak = (digest) =>
    Object.values(digest.topics)
      .filter((t) => t.correct < t.answered)
      .sort((a, b) => a.correct / a.answered - b.correct / b.answered || b.answered - a.answered);
  const due = (state = Store.data) =>
    state.reminders.filter((r) => r.day >= H.key()).sort((a, b) => a.day.localeCompare(b.day));
  const notices = (state = Store.data) => [
    ...due(state).map((r) => ({
      ...r,
      id: `reminder-${r.id}`,
      icon: 'calendar',
      title: r.label,
      summary: `${Catalog.courses[r.subject].name} · ${H.date(H.dayAt(r.day))}`,
      route: '#announcements/reminders',
    })),
    ...Catalog.demos,
  ];
  const badges = (state = Store.data, sum = digest(state.history), day = current(state, sum)) => [
    {
      icon: 'zap',
      tone: 'lime',
      title: 'First step',
      desc: 'Submit a quiz with an answer',
      unlocked: sum.answered > 0,
    },
    {
      icon: 'layers',
      tone: 'lilac',
      title: 'Recall builder',
      desc: 'Mark 10 cards understood',
      unlocked: state.understood.length >= 10,
    },
    {
      icon: 'flame',
      tone: 'sand',
      title: 'Momentum',
      desc: 'Study three days in a row',
      unlocked: day.streak >= 3,
    },
    {
      icon: 'target',
      tone: 'blue',
      title: 'Wide reader',
      desc: 'Answer 40 different questions',
      unlocked: sum.unique.size >= 40,
    },
  ];
  return { grade, digest, current, problematic, weak, due, notices, badges };
})();

// Reusable semantic templates. Escape every dynamic string and attribute at the sink.
const UI = (() => {
  const { esc } = H;
  const arabicOnly = (value) =>
    /\p{Script=Arabic}/u.test(value) && !/\p{Script=Latin}/u.test(value);
  const arabicPhrase =
    /([\p{Script_Extensions=Arabic}\u200c\u200d]+(?: +[\p{Script_Extensions=Arabic}\u200c\u200d]+)*)/gu;
  // Escape each segment before adding direction/language metadata for Arabic learners and AT.
  const rich = (value) =>
    String(value ?? '')
      .split(arabicPhrase)
      .map((part, i) => (i % 2 ? `<bdi lang="ar" dir="rtl">${esc(part)}</bdi>` : esc(part)))
      .join('');
  const ico = (name, cls = '') =>
    `<svg class="${esc(cls)}" aria-hidden="true" focusable="false"><use href="#i-${esc(name)}"/></svg>`;
  const stamp = (icon, tone = 'lime') =>
    `<span class="stamp tone-${esc(tone)}">${ico(icon)}</span>`;
  const values = (data) =>
    Object.entries(data || {})
      .map(([key, value]) => ` data-${key}="${esc(value)}"`)
      .join('');
  const link = (label, href, cfg = {}) =>
    `<a class="${cfg.plain ? 'text-link' : `btn ${esc(cfg.kind || '')}`}" href="${esc(href)}"${cfg.label ? ` aria-label="${esc(cfg.label)}"` : ''}>${cfg.icon ? ico(cfg.icon) : ''}${esc(label)}${cfg.end ? ico(cfg.end) : ''}</a>`;
  const btn = (label, action, cfg = {}) =>
    `<button type="button" class="${cfg.plain ? 'text-link' : `btn ${esc(cfg.kind || '')}`}" data-action="${esc(action)}"${values(cfg.data)}${cfg.disabled ? ' disabled' : ''}${cfg.pressed == null ? '' : ` aria-pressed="${cfg.pressed}"`}>${cfg.icon ? ico(cfg.icon) : ''}${esc(label)}${cfg.end ? ico(cfg.end) : ''}</button>`;
  const iconBtn = (label, icon, action, data = {}, pressed = null, disabled = false) =>
    `<button type="button" class="icon-btn" aria-label="${esc(label)}" title="${esc(label)}" data-action="${esc(action)}"${values(data)}${pressed == null ? '' : ` aria-pressed="${pressed}"`}${disabled ? ' disabled' : ''}>${ico(icon)}</button>`;
  const tag = (label, tone = '', icon = '') =>
    `<span class="chip${tone ? ` tone-${esc(tone)}` : ''}">${icon ? ico(icon) : ''}${esc(label)}</span>`;
  const heading = (title, description, label = '', aside = '') =>
    `<header class="phead"><div>${label ? `<span class="eyebrow">${esc(label)}</span>` : ''}<h1 tabindex="-1">${esc(title)}</h1>${description ? `<p>${esc(description)}</p>` : ''}</div>${aside}</header>`;
  const sec = (title, description = '', aside = '') =>
    `<div class="section-title"><div><h2>${esc(title)}</h2>${description ? `<p>${esc(description)}</p>` : ''}</div>${aside}</div>`;
  const empty = (icon, title, copy, action = '') =>
    `<div class="empty">${stamp(icon)}<h3>${esc(title)}</h3><p>${esc(copy)}</p>${action}</div>`;
  const note = (message, icon = 'info', variant = '') =>
    `<p class="notice ${esc(variant)}">${ico(icon)}<span>${rich(message)}</span></p>`;
  const progress = (n, max, label) =>
    `<progress value="${Math.max(0, Math.min(n, max))}" max="${Math.max(1, max)}" aria-label="${esc(label)}"></progress>`;
  const line = (label, n, max, count = `${n} / ${max}`) =>
    `<div class="progress-line"><div class="spread"><span>${esc(label)}</span><strong>${esc(count)}</strong></div>${progress(n, max, label)}</div>`;
  const ring = (n, max, label) =>
    `<div class="ring" role="img" aria-label="${esc(label)}: ${n} of ${max}"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-track" cx="50" cy="50" r="41"/><circle class="ring-arc" cx="50" cy="50" r="41" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${100 - Math.min(100, H.percent(n, max))}"/></svg><div><strong>${n}</strong><small>of ${max}</small></div></div>`;
  const optionList = (pairs, selected) =>
    pairs
      .map(
        ([id, label]) =>
          `<option value="${esc(id)}"${selected === id ? ' selected' : ''}>${esc(label)}</option>`
      )
      .join('');
  const tab = (label, action, id, selected, n = null) =>
    `<button class="tab" type="button" data-action="${esc(action)}" data-value="${esc(id)}" aria-pressed="${selected}">${esc(label)}${n == null ? '' : `<span class="tab-number">${n}</span>`}</button>`;
  const courseTabs = (page, subject, includeAll = false) =>
    `<nav class="tabs course-tabs" aria-label="Choose subject">${(includeAll
      ? [[null, 'All subjects', 'books']]
      : []
    )
      .concat(
        Catalog.keys.map((slug) => [slug, Catalog.courses[slug].name, Catalog.courses[slug].icon])
      )
      .map(
        ([slug, name, icon]) =>
          `<a class="tab" href="#${page}${slug ? '/' + slug : ''}"${slug === subject ? ' aria-current="page"' : ''}>${ico(icon)}${esc(name)}</a>`
      )
      .join('')}</nav>`;
  const courseOptions = () => Catalog.keys.map((slug) => [slug, Catalog.courses[slug].name]);
  const bookmarks = (q, extra = {}) =>
    iconBtn(
      Store.data.saved.includes(q.id) ? 'Remove bookmark' : 'Bookmark question',
      'bookmark',
      'bookmark',
      { qid: q.id, ...extra },
      Store.data.saved.includes(q.id)
    );
  const explain = (q) => {
    const ref = H.safeRef(q.reference?.url);
    return `<div class="explain"><strong>Why this is correct</strong><p>${rich(q.explanation)}</p>${q.note ? `<p class="muted tiny"><strong>Source note:</strong> ${esc(q.note)}</p>` : ''}${q.origin ? `<p class="source-line muted tiny">${esc(q.origin)}</p>` : ''}${ref ? `<a class="text-link" href="${esc(ref)}" target="_blank" rel="noopener noreferrer">${esc(q.reference.label)}${ico('arrow-up-right')}</a>` : ''}</div>`;
  };
  const questionAnswers = (q, chosen = null, order = null) =>
    `<ul class="answers-read">${(order || q.options.map((_, i) => i)).map((i, slot) => `<li class="${i === q.answer ? 'right' : i === chosen ? 'wrong' : ''}"><span>${'ABCD'[slot]}</span><div>${rich(q.options[i])}${i === q.answer ? '<small>Correct answer</small>' : i === chosen ? '<small>Your answer</small>' : ''}</div></li>`).join('')}</ul>${explain(q)}`;
  function question(
    q,
    {
      chosen = null,
      result = false,
      number = q.number,
      open = false,
      manage = false,
      order = null,
    } = {}
  ) {
    const state =
      chosen === q.answer
        ? ['Correct', 'lime']
        : chosen == null
          ? ['Unanswered', 'sand']
          : ['Incorrect', 'rose'];
    return `<article class="q-row" data-qid="${q.id}"><details class="q-details"${open ? ' open' : ''}><summary><span class="q-number">${H.pad(number)}</span><span class="q-summary"><small>${esc(Catalog.topics[q.topic])} · ${q.sourceType === 'past' ? 'Past paper' : 'Revision'}</small><strong dir="auto">${rich(q.text)}</strong></span>${result ? tag(...state) : ''}${ico('chevron-down', 'q-chevron')}</summary><div class="q-content">${open ? questionAnswers(q, chosen, order) : ''}</div></details><div class="q-acts">${bookmarks(q)}${manage ? iconBtn('Organise saved question', 'folder', 'organise', { qid: q.id }) : ''}</div></article>`;
  }
  const attemptName = (a) =>
    a.mode === 'exam'
      ? 'Timed mock'
      : {
          quick: 'Quick practice',
          topic: 'Topic practice',
          saved: 'Saved-question practice',
          custom: 'Custom practice',
        }[a.kind] || 'Practice';
  const resultRow = (a) => {
    const g = Stats.grade(a);
    const course = Catalog.courses[a.subject];
    return `<a class="activity-row" href="#result/${esc(a.id)}">${stamp(a.mode === 'exam' ? 'clipboard' : 'zap', course.tone)}<span class="activity-label"><strong>${esc(attemptName(a))}</strong><small>${esc(course.short)} · ${esc(H.date(a.completedAt))}</small></span><span class="activity-score">${g.percent}%</span>${ico('chevron-right')}</a>`;
  };
  const resumeRow = (a) =>
    `<a class="activity-row resume-row" href="#quiz/${esc(a.id)}">${stamp('play', Catalog.courses[a.subject].tone)}<span class="activity-label"><strong>Resume ${esc(a.mode === 'exam' ? 'mock exam' : 'practice')}</strong><small>${esc(Catalog.courses[a.subject].short)} · Question ${a.index + 1} of ${a.ids.length}</small></span>${ico('arrow-right')}</a>`;
  const med = (icon, tone, title, value, suffix, foot = '') =>
    `<article class="panel metric"><div class="metric-top">${stamp(icon, tone)}<span>${esc(title)}</span></div><div class="metric-value tabular" role="img" aria-label="${esc(`${value}${suffix || ''}`)}">${typeof value === 'number' && value > 0 ? `<span data-count="${value}">${value}</span>` : esc(value)}${suffix ? `<small>${esc(suffix)}</small>` : ''}</div>${foot ? `<p>${esc(foot)}</p>` : ''}</article>`;
  return {
    ico,
    rich,
    arabicOnly,
    stamp,
    link,
    btn,
    iconBtn,
    tag,
    heading,
    sec,
    empty,
    note,
    progress,
    line,
    ring,
    optionList,
    tab,
    courseTabs,
    courseOptions,
    bookmarks,
    explain,
    question,
    questionAnswers,
    attemptName,
    resultRow,
    resumeRow,
    med,
  };
})();

      ${med('flame', 'sand', 'Study streak', day.streak, ` ${day.streak === 1 ? 'day' : 'days'}`, 'Study on consecutive days')}

    <div class="bento activity-zone" data-reveal><section aria-label="Study activity">${sec('Recent activity', 'Your latest sessions.', link('View all', '#performance', { plain: true, end: 'arrow-right' }))}<div class="panel activity-list">${s.sessions.slice(0, 2).map(UI.resumeRow).join('') + s.history.slice(0, 3).map(UI.resultRow).join('') || `<div class="activity-blank">${stamp('history', 'lilac')}<div><strong>No activity yet</strong><p>After your first session, you’ll see your progress here.</p></div></div>`}</div>

          ''
        )}</div><p class="muted tiny">Difficulty bands are study aids, not university ratings.</p><div class="cluster">${link('Read question bank', `#study/${subject}`, { icon: 'book' })}${link('Practise', `#practice/${subject}`, { kind: 'secondary', icon: 'zap' })}${link('Timed mock', `#exams/${subject}`, { kind: 'secondary', icon: 'clipboard' })}${link('Course notes', `#notes/${subject}`, { kind: 'secondary', icon: 'edit' })}</div></section>
      <section class="panel pad">${sec('Topic map', 'Open a topic to study its questions.')}<div class="topic-list">${course.topics.map((topic) => `<div class="topic-row"><a href="#study/${subject}/${topic}"><strong>${H.esc(Catalog.topics[topic])}</strong><small>${H.plural(course.bank.filter((q) => q.topic === topic).length, 'question')}</small></a>${UI.iconBtn(Store.data.savedTopics.includes(Catalog.topicKey(subject, topic)) ? 'Remove topic bookmark' : 'Bookmark ' + Catalog.topics[topic], 'bookmark', 'topic-save', { subject, topic }, Store.data.savedTopics.includes(Catalog.topicKey(subject, topic)))}</div>`).join('')}</div></section></div>
      <section class="spaced" data-reveal aria-labelledby="revision-guide-title"><div class="section-title"><div><h2 id="revision-guide-title">Revision guide</h2><p>Key ideas to review before starting a session.</p></div></div><div class="study-guide">${STUDY_GUIDES[subject].map((item) => `<details class="guide-entry"><summary>${H.esc(item.title)} <small>${H.esc(item.pages)}</small></summary><p>${UI.rich(item.body)}</p></details>`).join('')}</div><p class="source muted tiny">${ico('info')} ${H.esc(course.credit)}</p></section>`;

  function bank(s, subject, filt, detail) {
    if (!subject)
      return pick(
        'study',
        'Study',
        'Choose a subject to read practice questions and explanations.'

    const c = Catalog.courses[subject];
    return `${heading('Question bank', `${c.name} · ${H.plural(c.bank.length, 'question')}`, `${Catalog.code} / STUDY`, courseTabs('study', subject))}<section class="panel pad bank-controls" aria-label="Question bank filters"><div class="search-field"><label class="sr-only" for="bank-query">Search this question bank</label>${ico('search')}<input class="search-input" type="search" id="bank-query" placeholder="Search keywords or #question…" value="${H.esc(filt.q)}" maxlength="100" autocomplete="off"></div><label class="field"><span>Difficulty</span><select id="bank-level">${UI.optionList([['all', 'All levels'], ...Object.entries(Catalog.difficulty)], filt.level)}</select></label><div class="tabs topic-tabs" aria-label="Filter topics">${tab('All topics', 'bank-topic', 'all', filt.topic === 'all', c.bank.length)}${c.topics.map((t) => tab(Catalog.topics[t], 'bank-topic', t, filt.topic === t, c.bank.filter((q) => q.topic === t).length)).join('')}</div></section><div id="bank-results">${bankResults(subject, filt, detail)}</div><p class="source muted tiny">${ico('info')} ${H.esc(c.credit)} ${subject === 'arabic' ? 'Revision items cite the relevant handout pages.' : 'Past-question numbering is preserved. Revision material is not an official answer key.'}</p>`;
  }
  function bankResults(subject, filt, detail) {
    const c = Catalog.courses[subject];
    const items = c.bank.filter(
      (q) =>
        (filt.topic === 'all' || q.topic === filt.topic) &&
        (filt.level === 'all' || q.level === filt.level) &&

    );
    return `<div class="bank-summary spread wrap"><span role="status">${H.plural(items.length, 'question')}</span>${filt.topic === 'all' ? link('Practise this subject', `#practice/${subject}`, { plain: true, end: 'arrow-right' }) : `<div class="cluster">${btn(Store.data.savedTopics.includes(Catalog.topicKey(subject, filt.topic)) ? 'Unsave topic' : 'Save topic', 'topic-save', { data: { subject, topic: filt.topic }, icon: 'bookmark', kind: 'secondary', pressed: Store.data.savedTopics.includes(Catalog.topicKey(subject, filt.topic)) })}${link('Practise this topic', `#practice/${subject}/${filt.topic}`, { plain: true, end: 'arrow-right' })}</div>`}</div><div class="q-list">${items.length ? items.map((q) => UI.question(q, { open: String(q.number) === detail })).join('') : empty('search', 'No matches', 'Try another keyword, difficulty or topic.', btn('Clear filters', 'bank-clear', { kind: 'secondary' }))}</div>`;
  }
  return { dashboard, courses, pick, bank, bankResults };
})();

// Subject-only session construction and stateless quiz/result views.
const Quiz = (() => {
  const { ico, stamp, tag, link, btn, heading, sec, empty, courseTabs, optionList, note, tab } = UI;
  const sizes = [20, 40, 60, 80, 100, 120];
  const defaultSize = (total) =>
    total >= 60 ? 60 : sizes.filter((n) => n <= total).at(-1) || total;
  const randomSeed = () => (Math.random() * 4294967295) >>> 0 || 1;
  function order(a, q) {
    const list = q.options.map((_, i) => i);
    if (!a.optionSeed || q.sourceType === 'past') return list;
    let x = (a.optionSeed ^ Math.imul(q.id, 2654435761)) >>> 0 || 1;
    for (let i = list.length - 1; i > 0; i--) {
      x ^= x << 13;
      x ^= x >>> 17;
      x ^= x << 5;
      const j = (x >>> 0) % (i + 1);
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  }
  function counts(total) {
    const initial = defaultSize(total);
    return `<fieldset class="length-controls" aria-describedby="pool-status"><legend>Number of questions</legend><div class="count-grid">${sizes.map((n) => `<label class="count-choice"><input type="radio" name="count" value="${n}"${n > total ? ' disabled' : ''}${n === initial ? ' checked' : ''}><span><strong>${n}</strong><small>${n === 60 ? 'Default' : 'Questions'}</small></span></label>`).join('')}</div><label class="count-alt"${!total || sizes.includes(total) ? ' hidden' : ''}><input type="radio" id="count-all" name="count" value="${total}"${initial === total && !sizes.includes(total) ? ' checked' : ''}${!total || sizes.includes(total) ? ' disabled' : ''}> <span id="count-all-label">Use all ${total} matching questions</span></label></fieldset>`;
  }
  function pool(subject, { topic = 'all', level = 'all', source = 'all' } = {}, s = Store.data) {
    if (!Catalog.isCourse(subject)) return [];
    const collection = s.collections.find((c) => c.id === source);
    return Catalog.courses[subject].bank.filter(
      (q) =>
        (topic === 'all' || q.topic === topic) &&
        (level === 'all' || q.level === level) &&
        (source === 'all' ||
          (source === 'saved'

  function make(subject, mode, options = {}) {
    const items = pool(subject, options);

  function examHistory(s, subject) {

  }

    <aside class="panel pad navigator" aria-label="Question navigator"><div class="spread"><h2>Question navigator</h2>${tag(exam ? 'Timed' : 'Untimed')}</div><div id="answered-line">${UI.line('Answered', g.answered, g.total)}</div><div id="question-map" class="question-map">${map(a)}</div><div class="map-legend"><span><i></i> Current</span><span><i></i> Answered</span><span><i></i> Flagged</span></div><div class="stack navigator-actions">${btn(exam ? 'Submit exam' : 'Finish practice', 'submit-quiz', { icon: 'check-circle' })}${btn('Restart session', 'restart', { kind: 'secondary', icon: 'refresh' })}</div><p class="muted tiny">${ico('device')} ${Store.available ? 'Saved in this browser' : 'Progress lasts until you close this view'}</p></aside></div>`;

    <section class="result-hero"><div><span class="hero-tag">${ico(a.expired ? 'clock' : 'check-circle')} ${a.expired ? 'TIME IS UP' : 'SESSION SUBMITTED'}</span><h2>${g.percent >= 75 ? 'Strong work.' : g.percent >= 45 ? 'Good progress.' : 'Keep building.'}</h2><p>${g.correct} of ${g.total} questions correct. ${g.blank ? `${H.plural(g.blank, 'unanswered question')}.` : ''}</p>${link('Practise again', `#${a.mode === 'exam' ? 'exams' : 'practice'}/${a.subject}`, { kind: 'signal', end: 'arrow-right' })}</div><div class="score-ring" aria-label="Score ${g.percent} percent" role="img">${UI.ring(g.correct, g.total, 'Score')}<strong>${g.percent}%</strong></div></section>

    <section class="spaced">${sec('Review your answers', 'Open any question to see its answer and explanation.')}<div class="tabs review-tabs" aria-label="Filter review">${[

  function review(a, filter) {

      .map((id, i) => {

      .filter((r) => filter === 'all' || filter === r.status);

  return {

    defaultSize,

    left,
    setup,
    map,
    feedback,
    options,
    view,
    result,
    review,

})();

// Session lifecycle, persisted deadlines and score transitions.
const Sessions = (() => {
  let clockId = null,
    clockHandle = null;
  const get = (id) => Store.data.sessions.find((a) => a.id === id);
  function add(attempt) {
    Store.change((s) => {
      s.sessions = [
        attempt,
        ...s.sessions.filter((a) => a.subject !== attempt.subject || a.mode !== attempt.mode),
      ];
    });
  }
  function stop() {
    clearInterval(clockHandle);
    clockId = null;
    clockHandle = null;
  }
  function pause(id) {
    if (clockId === id) stop();
    const current = get(id);
    if (current?.mode !== 'exam' || current.deadline == null) return;
    Store.change((s) => {
      const a = s.sessions.find((a) => a.id === id);
      if (a?.deadline != null) {
        a.remaining = Quiz.left(a);
        a.deadline = null;
      }
    });
  }
  function start(id, expire) {
    const a = get(id);
    if (a?.mode !== 'exam') {
      stop();
      return;
    }
    if (clockId === id && a.deadline != null) return;
    stop();
    if (a.deadline == null && a.remaining > 0)
      Store.change((s) => {
        const a = s.sessions.find((a) => a.id === id);
        if (a?.deadline == null && a?.remaining > 0) a.deadline = Date.now() + a.remaining;
      });
    function tick() {
      const a = get(id);
      if (!a) {
        stop();
        return;
      }
      const ms = Quiz.left(a),
        label = H.$('#timer');
      if (ms <= 0) {
        stop();
        expire(id);
        return;
      }
      if (!label) return;
      const value = H.clock(ms);
      if (label.textContent !== value) {
        label.textContent = value;
        const parent = label.closest('.timer');
        parent.classList.toggle('low', ms <= 60000);
        parent.querySelector('progress').value = ms;
      }
    }
    clockId = id;
    clockHandle = setInterval(tick, 250);
    tick();
  }
  function mutate(id, fn) {
    return Store.change((s) => {
      const a = s.sessions.find((a) => a.id === id);
      return a ? fn(a) : null;
    });
  }
  function finish(id, expired = false) {
    if (clockId === id) stop();
    return Store.change((s) => {
      const a = s.sessions.find((a) => a.id === id);
      if (!a || s.history.some((item) => item.id === id)) return null;
      expired ||= a.mode === 'exam' && Quiz.left(a) <= 0;
      const result = {
        ...a,
        remaining: expired ? 0 : Quiz.left(a),
        deadline: null,
        completedAt: Date.now(),
        expired,
      };
      s.history = [result, ...s.history].slice(0, Store.MAX_HISTORY);
      s.sessions = s.sessions.filter((item) => item.id !== id);
      return result;
    });
  }
  function restart(id) {
    if (clockId === id) stop();
    const a = get(id);
    if (!a) return null;
    const fresh = {
      ...a,
      id: H.uid(),
      previousId: null,
      ids: a.optionSeed ? H.shuffle(a.ids) : a.ids,
      optionSeed: a.optionSeed ? Quiz.randomSeed() : 0,
      index: 0,
      answers: Object.create(null),
      flags: [],
      createdAt: Date.now(),
      deadline: null,
      remaining: a.duration,
    };
    add(fresh);
    return fresh;
  }
  return { get, add, stop, pause, start, mutate, finish, restart };
})();

// Revision decks, curated bookmarks and collections. All quiz links stay subject-scoped.
const Learning = (() => {
  const { ico, stamp, tag, link, btn, heading, sec, empty, optionList, courseTabs, tab } = UI;
  function deck(s, subject) {
    const prior = s.flash[subject];
    const filter = prior?.filter || 'all';
    const hard = filter === 'hard' ? Stats.problematic(s.history, subject) : null;
    const possible = Catalog.courses[subject].bank
      .filter(
        (q) =>
          filter === 'all' ||
          (filter === 'known'
            ? s.understood.includes(q.id)
            : !s.understood.includes(q.id) && (s.saved.includes(q.id) || hard.has(q.id)))
      )
      .map((q) => q.id);
    const ids = H.unique([
      ...(prior?.ids || []).filter((id) => possible.includes(id)),
      ...possible,
    ]);
    const priorId = prior?.ids[prior.index];
    const index = ids.includes(priorId)
      ? ids.indexOf(priorId)
      : H.int(prior?.index, 0, Math.max(0, ids.length - 1), 0);
    return { ids, index, filter };
  }
  function flash(s, subject, flipped) {
    const c = Catalog.courses[subject],
      d = deck(s, subject),
      q = Catalog.get(d.ids[d.index]);
    const n = s.reviews[H.key()]?.length || 0,
      goal = s.prefs.cardGoal;
    const known = c.bank.filter((q) => s.understood.includes(q.id)).length;
    return `${heading('Flashcards', 'Recall the answer before turning the card over.', `${Catalog.code} / ACTIVE RECALL`, courseTabs('flashcards', subject))}
    <div class="split flash-layout"><div class="stack"><div class="spread wrap"><div class="tabs" aria-label="Flashcard deck">${[
      ['all', 'All cards'],
      ['hard', 'Difficult'],
      ['known', 'Understood'],
    ]
      .map(([id, label]) => tab(label, 'deck-filter', id, d.filter === id))
      .join(
        ''
      )}</div>${btn('Shuffle', 'deck-shuffle', { kind: 'secondary', icon: 'shuffle', disabled: d.ids.length < 2 })}</div>
    ${q ? `<button class="flash-flip${flipped ? ' flipped' : ''}" data-action="flip" type="button" aria-pressed="${flipped}" aria-label="${flipped ? 'Show question' : 'Reveal answer'}" aria-describedby="${flipped ? 'flash-answer flash-explanation' : 'flash-prompt'}"><span class="flash-core"><span class="flash-face flash-front" aria-hidden="${flipped}"><span class="flash-label">${ico('layers')} CARD ${H.pad(d.index + 1)} / ${H.pad(d.ids.length)}</span><span class="flash-text" id="flash-prompt">${UI.rich(q.text)}</span><span class="flash-hint">${ico('swap')} Tap to reveal answer</span></span><span class="flash-face flash-back" aria-hidden="${!flipped}"><span class="flash-label">${ico('check-circle')} ${H.esc(Catalog.topics[q.topic])}</span><span class="flash-text" id="flash-answer" dir="auto">${UI.rich(q.options[q.answer])}</span><span class="flash-explanation" id="flash-explanation">${UI.rich(q.explanation)}</span><span class="flash-hint">${ico('swap')} Tap to return</span></span></span></button><div class="spread wrap flash-actions"><div class="cluster">${btn('Previous', 'deck-move', { kind: 'secondary', icon: 'arrow-left', data: { delta: -1 }, disabled: d.index === 0 })}${btn('Next card', 'deck-move', { kind: 'secondary', end: 'arrow-right', data: { delta: 1 }, disabled: d.index === d.ids.length - 1 })}</div><div class="cluster">${UI.bookmarks(q)}${btn(s.understood.includes(q.id) ? 'Marked understood' : 'Mark as understood', 'understood', { icon: 'check', data: { qid: q.id }, pressed: s.understood.includes(q.id) })}</div></div>` : empty('layers', 'No cards in this deck', d.filter === 'hard' ? 'Questions you bookmark, flag in a submitted quiz, or recently answer incorrectly appear here until marked understood.' : 'Mark a card as understood to see it here.', btn('All cards', 'deck-filter', { data: { value: 'all' }, kind: 'secondary' }))}</div>
    <aside class="panel pad stack flash-aside"><div class="panel-kicker">${stamp('target', 'lilac')}<div><span class="eyebrow">DAILY REVISION</span><h2>Recall target</h2></div></div><div class="day-body">${UI.ring(n, goal, 'Unique cards reviewed today')}<div><strong>${n >= goal ? 'Target met' : 'Cards turned today'}</strong><small>Each distinct card counts once.</small></div></div>${UI.line('Understood in this subject', known, c.bank.length)}${btn('Edit study goals', 'goals', { kind: 'secondary', icon: 'edit' })}</aside></div>`;
  }
  function markReview(subject, d) {
    const id = d.ids[d.index];
    if (!id || Catalog.get(id).subject !== subject) return;
    const day = H.key();
    if (Store.data.reviews[day]?.includes(id)) return;
    Store.change((s) => {
      s.flash[subject] = d;
      s.reviews[day] = H.unique([...(s.reviews[day] || []), id]);
      const keys = Object.keys(s.reviews).sort();
      for (const past of keys.slice(0, Math.max(0, keys.length - 400))) delete s.reviews[past];
    });
  }
  function bookmarks(s, filt) {
    const selected = s.collections.find((c) => c.id === filt.collection);
    const ids = selected ? selected.ids : s.saved;
    return `${heading('Bookmarks', 'Build a revision shelf of questions and topics you want to revisit.', `${Catalog.code} / SAVED REVISION`, btn('New collection', 'new-collection', { icon: 'plus' }))}

      .join(
        ''
      )}${selected ? btn('Remove collection', 'delete-collection', { kind: 'secondary', icon: 'trash', data: { id: selected.id } }) : ''}</div></div><div id="saved-results">${savedResults(s, filt)}</div></section>
    <aside class="panel pad stack"><div class="panel-kicker">${stamp('bookmark', 'lilac')}<div><span class="eyebrow">REVISION TOPICS</span><h2>Saved topics</h2></div></div>${
      s.savedTopics.length
        ? `<div class="topic-list">${s.savedTopics
            .map((key) => {
              const [subject, topic] = key.split(':');
              return `<div class="topic-row"><a href="#practice/${subject}/${topic}"><strong>${H.esc(Catalog.topics[topic])}</strong><small>${H.esc(Catalog.courses[subject].short)}</small></a>${UI.iconBtn('Remove topic bookmark', 'bookmark', 'topic-save', { subject, topic }, true)}</div>`;
            })
            .join('')}</div>`
        : `<p class="muted tiny">Save topics from your course or question bank to revise them here.</p>`
    }${link('Browse the banks', '#study', { kind: 'secondary', icon: 'book' })}</aside></div>`;
  }
  function savedResults(s, filt) {
    const col = s.collections.find((c) => c.id === filt.collection);
    const qs = (col ? col.ids : s.saved)
      .map(Catalog.get)
      .filter(
        (q) => (filt.subject === 'all' || q.subject === filt.subject) && Catalog.search(q, filt.q)
      );
    return `<div class="bank-summary" role="status">${H.plural(qs.length, 'saved question')}</div><div class="q-list">${qs.length ? qs.map((q) => UI.question(q, { manage: true })).join('') : empty('bookmark', filt.q ? 'No matches' : 'No saved questions here', filt.q ? 'Try another keyword or subject.' : 'Use the bookmark icon in Study, Practice or your answer review.', link('Open a question bank', '#study', { kind: 'secondary', end: 'arrow-right' }))}</div>`;
  }
  return { deck, flash, markReview, bookmarks, savedResults };
})();

// Local analytics, reminders, achievements and student settings.
const Insights = (() => {
  const {
    ico,
    stamp,
    tag,
    btn,
    link,
    heading,
    sec,
    line,
    empty,
    tab,
    med,
    note,
    optionList,
    courseTabs,

  function chart(total) {
    const rows = Object.entries(total.daily)
      .filter(([, v]) => v.answered)
      .sort(([a], [b]) => a.localeCompare(b))
      .slice(-10);
    if (!rows.length)
      return `<div class="chart-empty"><div aria-hidden="true"></div><p>${ico('activity')} No submitted answers in this range.</p></div>`;
    const points = rows.map(([day, n]) => ({ day, ...n, pct: H.percent(n.correct, n.answered) }));
    const delta = points.at(-1).pct - points[0].pct;
    const change =
      points.length > 1
        ? `<p class="muted tiny trend-change">${delta === 0 ? 'No change' : 'Change: ' + (delta > 0 ? '+' : '') + delta + ' percentage points'} from first to latest day shown.</p>`
        : '';
    return `<figure class="trend" aria-label="Accuracy by active study day"><div class="trend-axis" aria-hidden="true"><span>100%</span><span>50%</span><span>0%</span></div><div class="trend-plot" style="--columns:${points.length}">${points.map((v) => `<div class="trend-slot" title="${H.esc(H.date(H.dayAt(v.day)))}: ${v.pct}% accuracy"><span class="trend-stick" style="--amount:${v.pct}%" aria-hidden="true"></span><span class="trend-key">${H.esc(v.day.slice(5).replace('-', '/'))}</span></div>`).join('')}</div></figure>${change}<details class="data-table"><summary>View chart data</summary><table><thead><tr><th scope="col">Study day</th><th scope="col">Answered</th><th scope="col">Accuracy</th></tr></thead><tbody>${points.map((v) => `<tr><td>${H.esc(H.date(H.dayAt(v.day)))}</td><td>${v.answered}</td><td>${v.pct}%</td></tr>`).join('')}</tbody></table></details>`;

    <label class="switch-line"><span><strong>In-app notifications</strong><small>Goal celebrations and reminder badges, no push notifications.</small></span><input name="notifications" type="checkbox" role="switch"${p.notifications ? ' checked' : ''}></label>
    <label class="switch-line"><span><strong>Practice sound</strong><small>A short tone after selecting an answer in practice.</small></span><input name="sound" type="checkbox" role="switch"${p.sound ? ' checked' : ''}></label><div class="form-actions"><button class="btn" type="submit">${ico('check')} Save settings</button></div></form></section>

// Plain-text course notebooks. Editing never rerenders the focused fields.
const Notebook = (() => {
  const { $, esc } = H;
  const { heading, ico, iconBtn, btn, link, optionList, courseOptions, stamp } = UI;
  const titleOf = (note) => note.title || 'Untitled note';

  function list(s, subject, selected, query) {
    const notes = s.notes.filter(
      (n) => (!subject || n.subject === subject) && H.match(`${n.title} ${n.body}`, query)
    );
    const path = `#notes/${subject || 'all'}`;
    return `<p class="note-list-count muted tiny" role="status">${H.plural(notes.length, 'note')}${query ? ' found' : ''}</p>${notes.length ? notes.map((n) => `<a href="${path}/${esc(n.id)}" class="note-row"${n.id === selected ? ' aria-current="page"' : ''}>${ico('edit')}<span><strong dir="auto">${esc(titleOf(n))}</strong><small>${esc(n.subject ? Catalog.courses[n.subject].short : 'General')} · ${esc(H.date(n.updated))}</small></span>${ico('chevron-right')}</a>`).join('') : `<p class="note-list-empty muted">${query ? 'Try another search.' : 'No notes here yet.'}</p>`}`;
  }

  function view(s, subject, id, query) {
    const note = s.notes.find((n) => n.id === id);
    const activeSubject = note ? note.subject : subject;
    const editor = note || id === 'new';
    const max = s.notes.length >= Store.MAX_NOTES;
    const next = btn('New note', 'new-note', { icon: 'plus', disabled: max });
    return `${heading('Notes', 'Keep definitions, examples and questions to revisit in one place.', 'WORKSPACE / NOTEBOOK', next)}
      <div class="notebook-layout">
        <section class="panel notebook-library" aria-labelledby="note-library-title">
          <div class="spread"><h2 id="note-library-title">Your notebook</h2><span class="chip tone-lilac" id="notebook-total">${H.plural(s.notes.length, 'note')}</span></div>
          <label class="field"><span>Show notes for</span><select id="note-filter">${optionList([['all', 'All subjects'], ...courseOptions()], subject || 'all')}</select></label>
          <label class="search-field"><span class="sr-only">Find a note</span>${ico('search')}<input class="search-input" id="note-query" type="search" maxlength="100" autocomplete="off" placeholder="Find a note…" value="${esc(query)}"></label>
          <div id="note-list" class="note-list">${list(s, subject, id, query)}</div>
        </section>
        ${
          editor
            ? `<section class="panel notebook-editor" aria-labelledby="note-editor-title"><div class="spread wrap"><div class="panel-kicker">${stamp('edit', 'lilac')}<div><span class="eyebrow">PRIVATE NOTE</span><h2 id="note-editor-title">${note ? 'Edit note' : 'New study note'}</h2></div></div>${note ? iconBtn('Delete note', 'trash', 'delete-note') : ''}</div>
          <form id="note-form" class="stack" data-note-id="${esc(note?.id || '')}"><div class="form-grid note-fields"><label class="field"><span>Title</span><input id="note-title" name="title" dir="auto" value="${esc(note?.title)}" maxlength="80" placeholder="Untitled note"></label><label class="field"><span>Subject</span><select name="subject">${optionList([['general', 'General / no subject'], ...courseOptions()], activeSubject || 'general')}</select></label></div>
          <label class="field"><span>Your notes</span><textarea name="body" id="note-body" dir="auto" maxlength="${Store.MAX_NOTE_LENGTH}" rows="10" placeholder="What did you learn? What do you want to revisit?">${esc(note?.body?.startsWith('\n') ? '\n' + note.body : note?.body)}</textarea></label>
          <div class="spread wrap note-editor-foot"><p id="note-status" class="muted tiny" role="status">${note ? (Store.available ? 'Saved in this browser' : 'Kept in this session only') : 'Changes save as you type.'}</p><button class="btn" type="submit">${ico('check')} Save note</button></div></form></section>`
            : `<section class="panel notebook-empty" aria-labelledby="note-editor-title"><div class="notebook-motif" aria-hidden="true">${ico('edit')}</div><span class="eyebrow">YOUR SPACE TO THINK</span><h2 id="note-editor-title">${max ? 'Choose a note to edit.' : 'Give what you learn a place to land.'}</h2><p>${max ? `Your notebook is full (${Store.MAX_NOTES} notes). Delete a note to make room.` : 'Start a note for a subject, jot down a tricky question, or write a recap in your own words.'}</p>${subject ? link('Open course', `#courses/${subject}`, { kind: 'secondary', end: 'arrow-right' }) : ''}</section>`
        }
      </div><p class="muted tiny note-privacy">${ico('lock')} ${Store.available ? 'Notes stay in this browser. They do not sync to other devices.' : 'Browser storage is unavailable. Notes last as long as this page is open.'}</p>`;
  }

  // Called on debounce, Save, and before any route change. Store.refresh merges other tabs first.
  function save(form) {
    const title = H.text(form.elements.title.value).slice(0, 80);
    const body = Store.noteBody(form.elements.body.value);
    const value = form.elements.subject.value;
    const subject = Catalog.isCourse(value) ? value : null;
    if (!form.dataset.noteId && !title && !body.trim())
      return { message: 'Enter a title or write something to save.' };
    const id = form.dataset.noteId || H.uid();
    const result = Store.change((s) => {
      const former = s.notes.find((n) => n.id === id);
      if (!former && form.dataset.noteId)
        return { message: 'This note was deleted in another tab.' };
      if (!former && s.notes.length >= Store.MAX_NOTES)
        return { message: `Your notebook is full (${Store.MAX_NOTES} notes).` };
      if (!former || former.title !== title || former.body !== body || former.subject !== subject) {
        s.notes = [
          { id, title, body, subject, updated: Date.now() },
          ...s.notes.filter((n) => n.id !== id),
        ];
      }
      return { id, subject };
    });
    if (result.id) {
      form.dataset.noteId = result.id;
      result.message = Store.available
        ? 'Saved in this browser'
        : 'Storage unavailable · kept for this page only';
      // The new draft becomes an editable note without losing cursor or undo history.
      const remove = $('button[data-action="delete-note"]', form.parentElement);
      if (!remove) {
        $('.notebook-editor > .spread').insertAdjacentHTML(
          'beforeend',
          iconBtn('Delete note', 'trash', 'delete-note')
        );
        $('#note-editor-title').textContent = 'Edit note';
      }
    }
    return result;
  }
  return { view, list, save };
})();

// Native dialogs share one focus trap, focus restoration, and keyboard dismissal.
const Overlays = (() => {
  const { $, $$ } = H,
    { ico, iconBtn, btn } = UI;
  const dialog = $('#overlay');
  let opener = null,
    commands = [],
    active = 0,
    runner = null;
  const link = (label, href, icon) =>
    `<a class="dialog-link" href="${H.esc(href)}">${ico(icon)}${H.esc(label)}${ico('chevron-right')}</a>`;
  function show(title, body, kind = '', target = '') {
    if (!dialog.open) opener = document.activeElement;
    dialog.className = kind;
    dialog.innerHTML = `<div class="dialog-body"><header class="dialog-head"><h2 id="overlay-title">${H.esc(title)}</h2>${iconBtn('Close dialog', 'x', 'close-overlay')}</header>${body}</div>`;
    if (!dialog.open) dialog.showModal();
    const node = (target && $(target, dialog)) || $('.dialog-head button', dialog);
    node?.focus({ preventScroll: true });
  }
  function close(restore = true) {
    if (!restore) opener = null;
    if (dialog.open) dialog.close();
    const more = $('[data-action="more"]');
    if (more) more.setAttribute('aria-expanded', 'false');
  }
  dialog.addEventListener('close', () => {
    if (dialog.open) return;
    if (opener?.isConnected) opener.focus({ preventScroll: true });
    opener = null;
    commands = [];
    runner = null;
    const more = $('[data-action="more"]');
    if (more) more.setAttribute('aria-expanded', 'false');
  });
  dialog.addEventListener('click', (e) => {
    if (e.target === dialog) {
      const r = dialog.getBoundingClientRect();
      if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)
        close();
    }
  });
  function confirm(title, copy, action, label, kind = '') {
    show(
      title,
      `<p class="dialog-note">${H.esc(copy)}</p><div class="cluster">${btn('Cancel', 'close-overlay', { kind: 'secondary' })}${btn(label, action, { kind })}</div>`,
      '',
      '[data-action="close-overlay"].btn'
    );
  }
  function search(onPick) {
    runner = onPick;
    active = 0;
    show(
      'Find anything',
      `<div class="search-bar">${ico('search')}<label class="sr-only" for="command-query">Search pages, courses and questions</label><input id="command-query" class="search-input" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="command-results" placeholder="Search pages, courses or questions…" autocomplete="off" maxlength="100"></div><div class="cmd-list" id="command-results" role="listbox" aria-label="Search results"></div><p class="dialog-note"><kbd>↑</kbd> <kbd>↓</kbd> move &nbsp; <kbd>Enter</kbd> open &nbsp; <kbd>Esc</kbd> close</p>`,
      'search-dialog',
      '#command-query'
    );
    query('');
  }
  function query(term) {
    const box = $('#command-results'),
      input = $('#command-query');
    if (!box || !input) return;
    const exact = (label) => H.match(label, term);
    const fuzzy = (label) => {
      const letters = H.norm(term).trim().replace(/\s/g, '');
      let i = 0;
      for (const char of H.norm(label)) if (letters[i] === char) i++;
      return letters.length >= 2 && i === letters.length;
    };
    const pages = Catalog.navItems.map(([route, title, icon]) => ({
      title,

        title: c.name,
        desc: `${Catalog.code} · Course`,
        icon: c.icon,
        href: `#courses/${k}`,
      };
    });
    const actions = [
      { title: 'Edit study goals', desc: 'Action', icon: 'target', action: 'goals' },
      { title: 'Switch light or dark theme', desc: 'Action', icon: 'moon', action: 'theme' },
      {
        title: 'Add an exam reminder',
        desc: 'Action',
        icon: 'calendar',
        href: '#announcements/reminders',
      },
    ];

    const base = [...pages, ...courses, ...actions];
    const exactNumber = /^#\d+$/.test(q);
    commands = q
      ? [
          ...base.filter((r) => exact(`${r.title} ${r.desc}`)),
          ...Catalog.all
            .filter((item) => q.length >= 2 && Catalog.search(item, q))
            .sort((a, b) =>
              exactNumber ? Number(b.sourceType === 'past') - Number(a.sourceType === 'past') : 0
            )
            .slice(0, 10)
            .map((item) => ({
              title: item.text,
              desc: `${Catalog.courses[item.subject].short} · Question ${item.number}`,
              icon: 'book',
              href: `#study/${item.subject}/${item.number}`,
            })),
          ...base.filter((r) => !exact(`${r.title} ${r.desc}`) && fuzzy(r.title)).slice(0, 4),
        ].slice(0, 16)
      : [pages[0], pages[3], pages[4], pages[5], ...courses, ...actions];
    active = 0;
    box.innerHTML = commands.length
      ? commands
          .map(
            (r, i) =>
              `<button id="cmd-${i}" class="cmd-option" tabindex="-1" type="button" role="option" aria-selected="${i === 0}" data-action="command-pick" data-index="${i}">${ico(r.icon)}<span><strong>${UI.rich(r.title)}</strong><small>${H.esc(r.desc)}</small></span>${ico('arrow-right')}</button>`
          )
          .join('')
      : `<span class="muted tiny" role="status">No matching pages or questions.</span>`;
    if (commands.length) input.setAttribute('aria-activedescendant', 'cmd-0');
    else input.removeAttribute('aria-activedescendant');
  }
  function move(delta) {
    if (!commands.length) return;
    active = (active + delta + commands.length) % commands.length;
    $$('.cmd-option', dialog).forEach((el, i) =>
      el.setAttribute('aria-selected', String(i === active))
    );
    $('#command-query')?.setAttribute('aria-activedescendant', `cmd-${active}`);
    $(`#cmd-${active}`)?.scrollIntoView({ block: 'nearest' });
  }
  function choose(index = active) {
    const choice = commands[index],
      cb = runner;
    if (!choice || !cb) return;
    close(false);
    cb(choice);
  }
  function profile(s) {
    show(
      'Student profile',
      `<div class="panel-kicker"><span class="avatar">${H.esc(H.initials(s.prefs.name))}</span><div><h3>${H.esc(s.prefs.name)}</h3><p class="dialog-note">Al-Hikmah University · 200 Level</p></div></div>${link('Profile & settings', '#settings', 'settings')}${link('My performance', '#performance', 'chart')}${btn('Switch theme', 'theme', { kind: 'secondary', icon: 'moon' })}<p class="dialog-note">Local profile only. No account or sign-in.</p>`,
      'pop'
    );
  }
  function quick() {
    show(
      'Quick actions',
      `${link('Start a practice session', '#practice', 'zap')}${link('Set up a mock exam', '#exams', 'clipboard')}${link('Review flashcards', '#flashcards', 'layers')}${link('Open notes', '#notes', 'edit')}${link('Add an exam reminder', '#announcements/reminders', 'calendar')}${btn('Edit study goals', 'goals', { kind: 'secondary', icon: 'target' })}`,
      'pop'
    );
  }
  function more() {
    show(
      'More destinations',
      `<div class="stack">${Catalog.navItems
        .filter(
          ([key]) => !['dashboard', 'courses', 'practice', 'exams', 'flashcards'].includes(key)
        )
        .map(([r, t, i]) => link(t, `#${r}`, i))

      'mobile-sheet'
