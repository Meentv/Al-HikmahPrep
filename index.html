*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  scroll-padding-top: 82px;
}
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 500 14px/1.55 var(--font);
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
}
button,
input,
select {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}
a {
  color: inherit;
  text-decoration: none;
}
p,
h1,
h2,
h3,
h4,
ul,
ol,
figure,
fieldset {
  margin: 0;
}
fieldset {
  padding: 0;
  border: 0;
  min-width: 0;
}
h1,
h2,
h3,
h4 {
  letter-spacing: -0.035em;
  color: var(--ink);
  line-height: 1.17;
  font-weight: 800;
}
h1 {
  font-size: clamp(28px, 3.3vw, 46px);
}
h2 {
  font-size: clamp(19px, 2.03vw, 27px);
}
h3 {
  font-size: 17px;
}
small {
  font-size: 12px;
}
img {
  max-width: 100%;
  display: block;
}
svg {
  width: 21px;
  height: 21px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.65;
  stroke-linecap: round;
  stroke-linejoin: round;
  vertical-align: middle;
}
.sprite {
  position: absolute;
  pointer-events: none;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
[hidden] {
  display: none !important;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}
h1:focus,
main:focus {
  outline: none;
}
.skip {
  position: fixed;
  z-index: 100;
  top: 8px;
  left: 8px;
  transform: translateY(-150%);
  padding: 10px 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 9px;
}
.skip:focus {
  transform: none;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--subtle);
  font: 650 10px/1.4 var(--mono);
  letter-spacing: 0.115em;
  text-transform: uppercase;
}
.eyebrow svg {
  width: 14px;
  height: 14px;
}
.muted {
  color: var(--muted);
}
.tiny {
  font-size: 12px;
}
.tabular {
  font-variant-numeric: tabular-nums;
}
.spread,
.row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.spread {
  justify-content: space-between;
}
.wrap {
  flex-wrap: wrap;
}
.cluster {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.stack {
  display: grid;
  gap: 12px;
}
.btn,
.icon-btn,
.chip,
.tab,
.text-link {
  border: 1px solid transparent;
  text-align: center;
  transition:
    background 0.16s,
    border-color 0.16s,
    color 0.16s,
    transform 0.17s var(--ease);
}
.btn {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  min-height: 42px;
  border-radius: 10px;
  padding: 9px 14px;
  background: var(--action);
  color: var(--action-ink);
  font-size: 12.5px;
  font-weight: 800;
  line-height: 1.2;
}
.btn svg {
  width: 16px;
  height: 16px;
}
.btn:not(:disabled):active,
.icon-btn:not(:disabled):active,
.tab:active {
  transform: scale(0.97);
}
.btn:hover {
  filter: brightness(1.07);
}
.btn.secondary {
  color: var(--ink);
  background: var(--panel);
  border-color: var(--line-strong);
}
.btn.secondary:hover,
.icon-btn:hover {
  background: var(--quiet);
}
.btn.signal {
  background: var(--signal);
  color: var(--signal-ink);
}
.btn.danger {
  background: var(--rose);
  color: var(--rose-ink);
  border-color: currentColor;
}
.btn.subtle {
  color: var(--accent);
  background: var(--accent-bg);
}
.text-link {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: none;
  padding: 3px 0;
  color: var(--accent);
  font-size: 12px;
  font-weight: 800;
}
.text-link svg {
  width: 15px;
  height: 15px;
}
.text-link:hover {
  text-decoration: underline;
  text-underline-offset: 3px;
}
.icon-btn {
  position: relative;
  display: inline-grid;
  place-items: center;
  padding: 0;
  width: 40px;
  height: 40px;
  flex: none;
  border-radius: 10px;
  color: var(--muted);
  background: var(--panel);
  border-color: var(--line);
}
.icon-btn svg {
  width: 18px;
  height: 18px;
}
.icon-btn[aria-pressed='true'] {
  color: var(--accent);
  background: var(--accent-bg);
  border-color: var(--line-strong);
}
.icon-btn[aria-pressed='true'] svg {
  fill: color-mix(in srgb, currentColor 17%, transparent);
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  width: max-content;
  max-width: 100%;
  border-radius: 7px;
  background: var(--quiet);
  padding: 4px 8px;
  color: var(--muted);
  font-size: 10.5px;
  font-weight: 800;
  line-height: 1.35;
}
.chip svg {
  width: 14px;
  height: 14px;
}
.tone-lime {
  background: var(--lime);
  color: var(--lime-ink);
}
.tone-lilac {
  background: var(--lilac);
  color: var(--lilac-ink);
}
.tone-sand {
  background: var(--sand);
  color: var(--sand-ink);
}
.tone-blue {
  background: var(--blue);
  color: var(--blue-ink);
}
.tone-rose {
  background: var(--rose);
  color: var(--rose-ink);
}
.stamp {
  width: 41px;
  height: 41px;
  display: grid;
  place-items: center;
  flex: none;
  border-radius: 11px;
}
.stamp svg {
  width: 20px;
  height: 20px;
}
.avatar {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  flex: none;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--lime);
  color: var(--lime-ink);
  font-size: 11px;
  font-weight: 800;
  line-height: 1;
}
.panel {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shade);
  min-width: 0;
}
.pad {
  padding: 20px;
}
.phead {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 13px;
  margin: 0 0 19px;
}
.phead p {
  color: var(--muted);
  margin-top: 6px;
}
.phead .eyebrow {
  margin-bottom: 8px;
}
.section-title {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.section-title p {
  margin-top: 3px;
  color: var(--muted);
  font-size: 12.5px;
}
.empty {
  display: grid;
  justify-items: start;
  gap: 8px;
  padding: 20px;
  border: 1px dashed var(--line-strong);
  border-radius: 13px;
  background: var(--panel);
  color: var(--muted);
}
.empty .stamp {
  width: 36px;
  height: 36px;
}
.empty h3 {
  font-size: 15px;
}
.empty p {
  font-size: 13px;
  max-width: 45ch;
}
.empty .btn {
  margin-top: 2px;
}
.field {
  display: grid;
  gap: 6px;
  min-width: 0;
}
.field label,
.field > span:first-child {
  font-size: 12px;
  font-weight: 800;
}
.field small {
  color: var(--muted);
  font-size: 11px;
}
.field input,
.field select,
.search-input {
  width: 100%;
  min-width: 0;
  min-height: 43px;
  padding: 9px 11px;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: var(--panel);
  color: var(--ink);
}
:is(input, select)::placeholder {
  color: var(--subtle);
}
.field input:focus,
.field select:focus,
.search-input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}
.form-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 4px;
}
.tabs {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px;
}
.tab {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px;
  min-height: 34px;
  border-radius: 8px;
  background: var(--panel);
  color: var(--muted);
  border-color: var(--line-strong);
  font-weight: 760;
  font-size: 11.5px;
}
.tab:hover {
  background: var(--quiet);
}
.tab[aria-pressed='true'],
.tab[aria-current='page'] {
  background: var(--accent-bg);
  color: var(--accent);
  border-color: var(--accent);
}
.tab svg {
  width: 14px;
  height: 14px;
}
.tab-number {
  font-size: 10px;
}
.notice {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  background: var(--accent-bg);
  color: var(--accent);
  border-radius: 10px;
  padding: 11px 12px;
  font-size: 12px;
  line-height: 1.5;
}
.notice svg {
  width: 17px;
  height: 17px;
  margin-top: 1px;
}
.notice.warn {
  background: var(--sand);
  color: var(--sand-ink);
}
progress {
  width: 100%;
  height: 7px;
  display: block;
  background: var(--quiet);
  border: 0;
  border-radius: 20px;
  overflow: hidden;
  accent-color: var(--accent);
  appearance: none;
}
progress::-webkit-progress-bar {
  background: var(--quiet);
  border-radius: 20px;
}
progress::-webkit-progress-value {
  background: var(--accent);
  border-radius: 20px;
  transition: width 0.24s var(--ease);
}
progress::-moz-progress-bar {
  background: var(--accent);
  border-radius: 20px;
}
.progress-line {
  display: grid;
  gap: 6px;
}
.progress-line .spread {
  font-size: 11px;
  color: var(--muted);
}
.progress-line .spread strong {
  color: var(--ink);
  font-weight: 800;
}
.boot {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 13px;
}
.boot > div {
  border-radius: var(--radius);
  height: 210px;
  background: linear-gradient(100deg, var(--quiet) 35%, var(--panel) 50%, var(--quiet) 65%);
  background-size: 220% 100%;
  animation: shimmer 1.4s linear infinite;
}
.boot > div:nth-child(3) {
  grid-column: 1/-1;
  height: 86px;
}
@keyframes shimmer {
  to {
    background-position: -220% 0;
  }
}
@media (max-width: 600px) {
  .form-grid {
    grid-template-columns: 1fr;
  }
  .phead {
    align-items: flex-start;
    flex-direction: column;
    gap: 9px;
  }
  .phead p {
    font-size: 13px;
  }
  .btn {
    min-height: 44px;
  }
  .tab {
    min-height: 40px;
  }
  .pad {
    padding: 15px;
  }
}

html[data-collapsed='true'] {
  --rail: 72px;
}
.rail {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--rail);
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  background: #1b251f;

.rail > .brand {

.brand-mark {
  width: 35px;

  border-radius: 10px;

.brand-mark svg {

}
.brand-label {

.brand-label > span {

.brand-label small {

.cohort-icon svg {

.cohort strong,
.cohort small {

.cohort strong {

.cohort small {

}
.rail-group-label {

}
.rail-link {

.rail-link svg {

.rail-link:hover {

.rail-link[aria-current='page'] svg {

.rail-link::after {

.rail :focus-visible {

.rail-tip {

  border: 1px solid #53644b;
  border-radius: 7px;
  font-size: 12px;
  pointer-events: none;
}
html[data-collapsed='true']
  .rail

html[data-collapsed='true'] .rail > .brand {

html[data-collapsed='true'] .rail-nav {

.workspace {

.topbar {

.topbar-actions {

.search-trigger {

.search-trigger svg {

  height: 16px;
}
.search-trigger kbd {

kbd {
  color: var(--subtle);
  display: inline-flex;
  white-space: nowrap;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 2px 5px;
  background: var(--panel);
  font: 600 10px/1.15 var(--mono);
}
#notice-dot {
  position: absolute;
  top: 6px;
  right: 7px;
  width: 7px;
  height: 7px;
  border-radius: 50%;

.mobile-brand,
.mobile-nav {

main {
  flex: 1;
  min-width: 0;
}
.foot {

  align-items: center;
  gap: 12px;

  color: var(--muted);

}
.foot small {

.foot svg {

  height: 14px;
}
.credit {

  gap: 8px;
  flex-wrap: wrap;
  align-items: center;

.credit a {
  display: flex;
  align-items: center;
  gap: 5px;
  border: 1px solid var(--line);
  background: var(--accent-bg);
  color: var(--accent);
  border-radius: 7px;
  padding: 6px 8px;
  font-weight: 800;
}
.credit a:hover {
  text-decoration: underline;
}
.scroll-progress {
  display: none;
}
.noscript {
  padding: 12px;
  background: var(--sand);
  color: var(--sand-ink);
}
@supports (animation-timeline: scroll()) {
  .scroll-progress {
    display: block;
    position: absolute;
    inset: auto 0 -1px;
    height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
    animation: scroll-read linear both;
    animation-timeline: scroll(root block);
    pointer-events: none;
  }
  @keyframes scroll-read {
    to {
      transform: scaleX(1);
    }
  }
}
#view {
  min-width: 0;
}
.motion-view #view {
  view-transition-name: desk-view;
}
::view-transition-group(desk-view) {
  animation-duration: 0.22s;
}
::view-transition-old(desk-view) {
  animation: 0.13s ease-out both exit-view;
}
::view-transition-new(desk-view) {
  animation: 0.22s var(--ease) both enter-view;
}
::view-transition-old(root),
::view-transition-new(root) {
  animation: none;
}
.route-enter {
  animation: 0.22s var(--ease) both enter-view;
}
@keyframes enter-view {
  from {
    opacity: 0.45;
    transform: translateY(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@keyframes exit-view {
  to {
    opacity: 0;
    transform: translateY(-4px);
  }
}
.revealed {
  animation: 0.26s var(--ease) both enter-view;
}
#overlay {
  width: min(520px, calc(100vw - 24px));
  max-height: min(730px, calc(100dvh - 28px));
  overflow: auto;
  padding: 0;
  border: 1px solid var(--line-strong);
  border-radius: 19px;
  background: var(--panel);
  color: var(--ink);
  box-shadow: 0 26px 90px #101d1650;
  overscroll-behavior: contain;
}
#overlay[open] {
  animation: dialog-in 0.22s var(--ease) both;
}
#overlay::backdrop {
  background: #12201991;
  animation: veil-in 0.18s ease-out both;
}
.dialog-body {
  padding: 21px;
  display: grid;
  gap: 12px;
}
.dialog-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
}
.dialog-head h2 {
  font-size: 21px;
  padding-top: 3px;
}
.dialog-head .icon-btn {
  width: 32px;
  height: 32px;
}
.pop {
  margin: calc(var(--bar) + 8px) clamp(10px, 2.4vw, 40px) auto auto;
  width: min(370px, calc(100vw - 22px)) !important;
}
.search-dialog {
  margin-top: min(13dvh, 110px);
  width: min(600px, calc(100vw - 22px)) !important;
}
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
}
.search-bar svg {
  color: var(--muted);
}
.cmd-list {
  display: grid;
  gap: 4px;
  min-height: 44px;
  max-height: 48dvh;
  overflow: auto;
}
.cmd-option {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 9px;
  width: 100%;
  text-align: left;
  border: 1px solid transparent;
  border-radius: 9px;
  background: var(--panel);
  color: var(--ink);
  padding: 8px;
  min-height: 44px;
}
.cmd-option:is(:hover, [aria-selected='true']) {
  background: var(--accent-bg);
  border-color: var(--line-strong);
}
.cmd-option strong,
.cmd-option small {
  display: block;
}
.cmd-option strong {
  font-size: 12px;
}
.cmd-option small {
  color: var(--muted);
  font-size: 10.5px;
}
.cmd-option svg {
  width: 17px;
  height: 17px;
}
.dialog-note {
  color: var(--muted);
  font-size: 12px;
}
.dialog-link {
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 43px;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--panel);
  color: var(--ink);
  font-weight: 750;
  font-size: 12px;
  text-align: left;
}
.dialog-link:hover {
  background: var(--quiet);
}
.dialog-link svg {
  width: 17px;
  height: 17px;
}
.dialog-link svg:last-child:not(:first-child) {
  margin-left: auto;
}
.toast {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 7px;
  max-width: min(410px, calc(100vw - 32px));
  padding: 11px 14px;
  border-radius: 11px;
  background: #293b2e;
  color: #f2f8eb;
  border: 1px solid #58714f;
  box-shadow: 0 10px 32px #18351d35;
  opacity: 0;
  transform: translateY(6px);
  pointer-events: none;
  visibility: hidden;
  transition: 0.2s var(--ease);
  font-size: 12px;
  font-weight: 750;
}
.toast.on {
  opacity: 1;
  visibility: visible;
  transform: none;
}
.toast svg {
  width: 17px;
  color: #dcf2a2;
}
@keyframes dialog-in {
  from {
    opacity: 0;
    transform: translateY(10px) scale(0.985);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes veil-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@media (min-height: 810px) and (min-width: 861px) {
  .rail-link {
    min-height: 40px;
  }
  .rail-group {
    margin-bottom: 15px;
  }
  .rail-group-label {
    padding-block: 10px 6px;
  }
  .cohort {
    margin-bottom: 14px;
  }
}
@media (max-width: 1050px) {
  :root {
    --rail: 194px;
  }
  .rail > .brand {
    padding-inline: 13px;
  }
}
@media (max-width: 860px) {
  :root {
    --bar: 58px;
  }
  .rail,
  .rail-toggle,
  .breadcrumbs {
    display: none !important;
  }
  .workspace {
    margin-left: 0;
    min-height: 100dvh;
    padding-bottom: calc(69px + env(safe-area-inset-bottom));
  }
  .topbar {
    padding-inline: 14px;
  }
  .mobile-brand {
    display: flex;
  }
  .mobile-brand .brand-mark {
    width: 33px;
    height: 33px;
  }
  .mobile-brand .brand-label {
    font-size: 17px;
  }
  .page-wrap {
    padding-top: 20px;
    min-height: calc(100dvh - var(--bar) - 69px - env(safe-area-inset-bottom));
  }
  .mobile-nav {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 1px;
    align-items: start;
    position: fixed;
    inset: auto 0 0;
    z-index: 21;
    background: var(--panel);
    border-top: 1px solid var(--line-strong);
    padding: 5px max(4px, env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom))
      max(4px, env(safe-area-inset-left));
    box-shadow: 0 -4px 18px #17231912;
  }
  .mobile-link {
    display: grid;
    position: relative;
    justify-items: center;
    align-content: center;
    gap: 3px;
    min-height: 53px;
    padding: 4px 0;
    background: transparent;
    border: 0;
    border-radius: 10px;
    color: var(--muted);
    font-size: 10px;
    font-weight: 780;
    text-align: center;
  }
  .mobile-link svg {
    width: 19px;
    height: 19px;
  }
  .mobile-link[aria-current],
  .mobile-link[aria-expanded='true'] {
    background: var(--accent-bg);
    color: var(--accent);
  }
  .mobile-link[aria-current]::before {
    content: '';
    position: absolute;
    top: 2px;
    width: 14px;
    height: 2px;
    border-radius: 20px;
    background: var(--accent);
  }
  #overlay.mobile-sheet {
    margin: auto 0 0;
    width: 100% !important;
    max-width: 100%;
    max-height: calc(100dvh - var(--bar));
    border-radius: 19px 19px 0 0;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .toast {
    bottom: calc(78px + env(safe-area-inset-bottom));
    right: 10px;
  }
  .search-trigger {
    width: 35px;
    display: grid;
    place-items: center;
    padding: 0;
  }
  .search-trigger span,
  .search-trigger kbd {
    display: none;
  }
}
@media (max-width: 600px) {
  .page-wrap {
    padding-inline: 13px;
  }
  .topbar-actions {
    gap: 4px;
  }
  .topbar-actions :is(.icon-btn, .search-trigger, .avatar) {
    width: 39px;
    height: 40px;
  }
  .topbar-actions .avatar {
    height: 35px;
    width: 35px;
  }
  .quick-top,
  .theme-top {
    display: none;
  }
  .foot {
    align-items: flex-start;
    flex-direction: column;
    gap: 8px;
    margin-top: 20px;
  }
  .dialog-body {
    padding: 15px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
  .scroll-progress {
    display: none !important;
  }
  ::view-transition-group(*),
  ::view-transition-old(*),
  ::view-transition-new(*) {
    animation: none !important;
  }
}

.dash-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 19px;
}
.dash-kicker {
  margin-bottom: 6px;
}
.dash-kicker i,
.hero-caption i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
}
.dash-kicker span {
  color: var(--line-strong);
  margin-inline: 3px;
}
.dash-head h1 {
  font-size: clamp(28px, 3vw, 42px);
  line-height: 1.1;
  overflow-wrap: anywhere;
}
.dash-head h1 span {
  color: var(--accent);
}
.dash-head p {
  color: var(--muted);
  margin-top: 6px;
  font-size: 13px;
}
.dash-date {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  flex: none;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--muted);
  font-weight: 650;
}
.dash-date svg {
  width: 15px;
  height: 15px;
}
.bento {
  display: grid;
  grid-template-columns: minmax(0, 2.35fr) minmax(241px, 1fr);
  gap: 14px;
}
.desk-hero {

  border-radius: 20px;
  border: 1px solid var(--line-strong);

.desk-hero::after {
  content: '';
  position: absolute;
  z-index: -1;
  inset: 0;
  pointer-events: none;
}
.hero-inner {
  padding: 25px 25px 23px;
  max-width: 490px;
}
.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  border: 1px solid transparent;
  border-radius: 6px;
  font: 650 9.7px/1.3 var(--mono);
  letter-spacing: 0.1em;
}
.hero-tag svg {
  width: 14px;
  height: 14px;
}
.hero-inner h2 {
  font-size: clamp(39px, 4.2vw, 64px);
  line-height: 0.98;
  letter-spacing: -0.081em;
  margin-top: 11px;
  font-weight: 800;
}

.hero-inner p {
  margin: 9px 0 15px;
  max-width: 35ch;
  font-size: 13px;
}
.hero-inner .btn {
  padding-inline: 11px;
  min-height: 37px;
}
.hero-caption {
  position: absolute;
  right: 13px;
  bottom: 10px;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 6px;
  border: 1px solid transparent;
  border-radius: 5px;
  font: 600 8.5px/1 var(--mono);
  letter-spacing: 0.08em;
}
.hero-caption span {
  margin-left: 8px;
}
.hero-caption i {
  width: 4px;
  height: 4px;
}
.day-card {
  padding: 15px 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 0;
}
.day-card .icon-btn {
  width: 30px;
  height: 30px;
}
.day-card .icon-btn svg {
  width: 15px;
  height: 15px;
}
.day-card h2 {
  font-size: 22px;
  margin: 0;
}
.day-card .eyebrow {
  letter-spacing: 0.1em;
}
.day-body {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 4px 0;
}
.day-body > div:last-child {
  min-width: 0;
}
.day-body strong,
.day-body small {
  display: block;
}
.day-body > div:last-child strong {
  font-size: 12px;
  line-height: 1.35;
}
.day-body > div:last-child small {
  color: var(--muted);
  margin-top: 3px;
  font-size: 10.5px;
  line-height: 1.35;
}
.ring {
  width: 100px;
  height: 100px;
  position: relative;
  display: grid;
  place-items: center;
  flex: none;
}
.ring > svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
  stroke-width: 7.5;
}
.ring-track {
  stroke: var(--quiet);
}
.ring-arc {
  stroke: var(--accent);
  transition: stroke-dashoffset 0.38s var(--ease);
  animation: 0.45s var(--ease) ring-draw;
}
@keyframes ring-draw {
  from {
    stroke-dashoffset: 100;
  }
}
.ring > div {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  font-variant-numeric: tabular-nums;
}
.ring strong {
  font-size: 31px !important;
  letter-spacing: -0.07em;
  line-height: 1 !important;
}
.ring small {
  color: var(--muted);
  font-size: 10px;
}
.week {
  padding: 0;
  list-style: none;
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
}
.week li {
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 4px;
  color: var(--muted);
  font: 650 10px/1.1 var(--mono);
  padding: 4px 2px;
  border-radius: 7px;
}
.week li.is-today {
  color: var(--accent);
  background: var(--accent-bg);
}
.week i {
  width: 17px;
  height: 17px;
  border-radius: 50%;
  border: 1px solid var(--line-strong);
  background: var(--quiet);
  display: grid;
  place-items: center;
}
.week li.did-study i {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--panel);
}
.week i svg {
  width: 12px;
  height: 12px;
}
.day-foot {
  font-size: 10.5px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  margin-top: 7px;
  padding-top: 7px;
  display: flex;
  align-items: center;
  gap: 5px;
}
.day-foot svg {
  width: 14px;
  height: 14px;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 11px;
  margin: 14px 0 21px;
}
.metric {
  padding: 12px 13px;
  overflow: hidden;
}
.metric-top {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted);
  font-size: 11.5px;
  font-weight: 800;
  line-height: 1.24;
}
.metric .stamp {
  width: 30px;
  height: 30px;
  border-radius: 8px;
}
.metric .stamp svg {
  width: 16px;
  height: 16px;
}
.metric-value {
  font-size: 33px;
  letter-spacing: -0.075em;
  font-weight: 800;
  line-height: 1.18;
  margin-top: 5px;
  white-space: nowrap;
}
.metric-value small {
  font-size: 13px;
  letter-spacing: -0.04em;
  font-weight: 760;
  color: var(--muted);
}
.metric p {
  font-size: 10.5px;
  color: var(--muted);
  margin-top: 4px;
}
.course-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.course-card {
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-width: 0;
  container-type: inline-size;
}
.course-banner {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  position: relative;
  isolation: isolate;
  overflow: hidden;
  padding: 11px;
  min-height: 89px;
  border-bottom: 1px solid var(--line);
  background-image:
    linear-gradient(0deg, transparent 94%, color-mix(in srgb, currentColor 10%, transparent) 96%),
    linear-gradient(90deg, transparent 94%, color-mix(in srgb, currentColor 10%, transparent) 96%);
  background-size: 18px 18px;
}
.course-banner .stamp {
  background: var(--panel);
  border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
  box-shadow: 0 2px 3px #22301809;
}
.course-code {
  font: 700 9px var(--mono);
  padding: 5px 6px;
  border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
  border-radius: 5px;
  background: var(--panel);
  white-space: nowrap;
}
.course-code span {
  opacity: 0.7;
}
.course-ornament {
  position: absolute;
  z-index: -1;
  right: 23%;
  top: 18px;
  width: 105px;
  height: 105px;
  border: 1px solid color-mix(in srgb, currentColor 34%, transparent);
  border-radius: 50%;
  box-shadow:
    0 0 0 8px color-mix(in srgb, currentColor 8%, transparent),
    0 0 0 18px color-mix(in srgb, currentColor 7%, transparent),
    0 0 0 29px color-mix(in srgb, currentColor 5%, transparent);
  transform: rotate(-22deg) scaleX(1.46);
}
.tone-lilac .course-ornament {
  transform: rotate(28deg) scaleX(1.5);
  border-radius: 33%;
}
.course-body {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px;
  flex: 1;
}
.course-body .eyebrow {
  font-size: 8.9px;
}
.course-body h2 a:hover,
.course-body h3 a:hover {
  text-decoration: underline;
  text-underline-offset: 3px;
}
.course-body p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.43;
}
.course-body .progress-line {
  margin-top: 5px;
}
.course-body .course-links {
  margin-top: auto;
  padding-top: 5px;
}
.course-compact .course-banner {
  min-height: 62px;
  padding: 9px 10px;
}
.course-compact .course-banner .stamp {
  width: 34px;
  height: 34px;
  border-radius: 8px;
}
.course-compact .course-banner .stamp svg {
  width: 17px;
  height: 17px;
}
.course-compact .course-body {
  padding: 12px;
  gap: 6px;
}
.course-compact .course-body h3 {
  font-size: clamp(15px, 1.5vw, 20px);
  letter-spacing: -0.045em;
}
.course-compact .course-body p {
  font-size: 11.5px;
}
.course-compact .course-links .btn {
  min-height: 34px;
  font-size: 11.2px;
}
.course-compact .course-links .chip {
  font-size: 9px;
}
.library .course-banner {
  min-height: 127px;
}
.library .course-ornament {
  width: 180px;
  height: 150px;
}
.library .course-body {
  gap: 11px;
  padding: 17px;
}
.library .course-body .cluster:not(.course-links) {
  gap: 6px 12px;
}
.pick-grid .pick-card {
  display: grid;
  gap: 13px;
  justify-items: start;
}
.pick-card .spread {
  width: 100%;
}
.pick-card .stamp {
  background: var(--panel);
}
.pick-card p {
  color: var(--ink);
  max-width: 42ch;
}
.pick-card .btn {
  align-self: end;
}
.dash-extras {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-top: 14px;
}
.dash-extras p {
  margin-top: 7px;
}
.dash-extras .text-link {
  margin-top: 6px;
}
.panel-kicker {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.panel-kicker > div {
  min-width: 0;
}
.panel-kicker h2,
.panel-kicker h3 {
  overflow-wrap: anywhere;
}
.panel-kicker .eyebrow {
  display: flex;
  margin-bottom: 4px;
}
.activity-list {
  padding: 4px 10px;
}
.activity-row {
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 58px;
  padding: 7px 4px;
  border-radius: 8px;
  transition: background 0.16s;
}
.activity-row:not(:last-child) {
  border-bottom: 1px solid var(--line);
}
.activity-row:hover {
  background: var(--quiet);
}
.activity-row .stamp,
.activity-blank .stamp {
  width: 34px;
  height: 34px;
  border-radius: 9px;
}
.activity-row svg,
.activity-blank svg {
  width: 16px;
  height: 16px;
}
.activity-label {
  flex: 1;
  min-width: 0;
}
.activity-label strong,
.activity-label small {
  display: block;
  line-height: 1.38;
}
.activity-label strong,
.activity-blank strong {
  font-size: 12px;
}
.activity-label small {
  color: var(--muted);
  margin-top: 3px;
  font-size: 10.5px;
}
.activity-score {
  font-weight: 800;
  white-space: nowrap;
  font-size: 11px;
  color: var(--accent);
}
.activity-blank {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 12px 3px;
  color: var(--ink);
}
.activity-blank p {
  color: var(--muted);
  font-size: 11.5px;
  max-width: 22ch;
  line-height: 1.45;
}
.split {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
  gap: 13px;
  align-items: start;
}
.spaced {
  margin-top: 22px;
}
.topic-list {
  display: grid;
  gap: 4px;
}
.topic-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 5px 7px 5px 11px;
}
.topic-row a {
  padding: 4px 0;
  flex: 1;
}
.topic-row a:hover strong {
  text-decoration: underline;
}
.topic-row strong,
.topic-row small {
  display: block;
}
.topic-row strong {
  font-size: 12px;
}
.topic-row small {
  font-size: 10px;
  color: var(--muted);
}
.topic-row .icon-btn {
  width: 32px;
  height: 32px;
}
.topic-row .icon-btn svg {
  width: 15px;
  height: 15px;
}
@container (max-width:245px) {
  .course-body .course-links .chip {
    display: none;
  }
  .course-body h2,
  .course-body h3 {
    overflow-wrap: anywhere;
  }
}
@media (max-width: 1100px) and (min-width: 861px) {
  .bento {
    grid-template-columns: minmax(0, 1.95fr) minmax(213px, 1fr);
  }
  .hero-inner {
    padding-inline: 18px;
  }
  .hero-inner h2 {
    font-size: clamp(39px, 4.1vw, 56px);
  }

  .ring {
    width: 83px;
    height: 83px;
  }
  .metric {
    padding-inline: 9px;
  }
  .metric-top {
    gap: 5px;
    font-size: 10px;
  }
}
@media (max-width: 715px) {
  .bento,
  .split {
    grid-template-columns: 1fr;
  }
  .bento > .day-card {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    align-items: center;
    gap: 4px 9px;
  }
  .day-card .spread {
    grid-column: 1/-1;
  }
  .day-card h2 {
    grid-column: 1/-1;
  }
  .day-card .day-foot {
    grid-column: 1/-1;
  }
  .day-card .ring {
    width: 77px;
    height: 77px;
  }
  .day-card .ring strong {
    font-size: 25px !important;
  }
  .day-card .day-body {
    margin: 0;
  }
  .course-tabs {
    width: 100%;
  }
  .metrics {
    margin: 11px 0 16px;
  }
}
@media (max-width: 530px) {
  .dash-head {
    align-items: flex-start;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
  }
  .dash-date {
    padding: 4px 7px;
    font-size: 9.5px;
  }
  .dash-date svg {
    width: 13px;
    height: 13px;
  }
  .hero-inner {
    padding: 17px 14px 115px;
  }
  .desk-hero {
    min-height: 285px;
    border-radius: 16px;
  }
  .hero-inner h2 {
    font-size: clamp(37px, 9vw, 49px);
    margin-top: 9px;
  }

  .hero-inner p {
    font-size: 12px;
    margin: 8px 0 10px;
  }
  .hero-inner .btn {
    font-size: 11.5px;
    min-height: 41px;
  }
  .hero-art {
    width: min(73%, 320px);
    height: 75%;
    top: auto;
    bottom: 0;
    background-position: 65% 50%;
    -webkit-mask-image: linear-gradient(145deg, transparent 12%, black 53%);
    mask-image: linear-gradient(145deg, transparent 12%, black 53%);
  }
  .hero-caption {
    font-size: 7.5px;
  }
  .metrics {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 7px;
  }
  .metric {
    padding: 9px;
  }
  .metric-top {
    font-size: 10.5px;
  }
  .metric-value {
    font-size: 27px;
  }
  .course-grid,
  .dash-extras {
    grid-template-columns: 1fr;
  }
  .course-compact .course-links .chip {
    display: inline-flex;
  }
  .section-title {
    gap: 6px;
  }
  .section-title .text-link {
    min-width: max-content;
  }
  .pick-grid .pick-card {
    gap: 8px;
  }
}

.metric-value small {
  margin-inline-start: 2px;
}
.day-sessions {
  margin-left: auto;
  padding-left: 5px;
  border-left: 1px solid var(--line);
  white-space: nowrap;
}
.trend-change {
  margin: 0 0 5px;
}
.mobile-link.secondary-current {
  color: var(--accent);
}
.cmd-list .dialog-link strong,
.cmd-list .dialog-link small {
  display: block;
  overflow-wrap: anywhere;
}
.cmd-list .dialog-link small {
  color: var(--muted);
  line-height: 1.35;
  font-size: 10.5px;
}
.panel h2,
.phead h1,
.notice-row h3 {
  overflow-wrap: anywhere;
}
@media (max-width: 600px) {
  .question-meta .icon-btn,
  .q-acts .icon-btn {
    min-width: 41px;
    min-height: 41px;
  }
  .day-card .icon-btn {
    width: 37px;
    height: 37px;
  }
}

.bank-controls {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(115px, 195px);
  align-items: end;
  gap: 12px;
  margin-bottom: 10px;
}
.search-field {
  display: flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  padding-inline: 9px;
  min-width: 0;
  min-height: 43px;
  background: var(--panel);
}
.search-field:focus-within {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}
.search-field svg {
  width: 17px;
  height: 17px;
  color: var(--muted);
}
.search-field .search-input {
  border: 0;
  min-height: 40px;
  padding: 8px 1px;
  outline: none;
  border-radius: 0;
}
.topic-tabs {
  grid-column: 1/-1;
}
.bank-summary {
  font-size: 12px;
  color: var(--muted);
  padding: 3px 0 9px;
}
.bank-summary .btn {
  min-height: 32px;
  font-size: 11px;
  padding: 6px 8px;
}
.q-list {
  display: grid;
  gap: 7px;
}
.q-row {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;

.q-details summary::-webkit-details-marker {

.q-details summary:hover .q-summary strong {

.q-number {

}
.q-summary small,
.q-summary strong {
  display: block;
}
.q-summary small {

.q-chevron {

.q-acts {

.q-acts .icon-btn svg {

.explain {

.explain .text-link {

.source {

.instructions h2 {

.instructions .stamp svg {
  width: 16px;
  height: 16px;
}
.instructions strong {
  font-size: 12px;
}
.instructions p {
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.45;
  margin-top: 3px;

.quiz-head .phead {

.quiz-controls {

.timer {

.timer strong {

.quiz-layout {

.question-panel {

}
.question-meta .icon-btn {
  height: 33px;
  width: 33px;
}
.question-title,
#question-title {
  font-size: clamp(20px, 2.28vw, 29px);
  line-height: 1.28;
  margin: 13px 0 15px;
  overflow-wrap: anywhere;
}
#question-title:focus {
  outline: 0;
}
#option-list {
  display: grid;
  gap: 7px;
}
.option {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 9px;
  min-height: 52px;
  position: relative;
  padding: 7px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: var(--panel);
  cursor: pointer;
  transition:
    border-color 0.15s,
    background 0.15s;
}
.option:hover {
  background: var(--quiet);
}
.option.selected {
  background: var(--accent-bg);
  border-color: var(--accent);
}
.option.correct {
  background: var(--accent-bg);
  border-color: var(--accent);
}
.option.incorrect {
  background: var(--rose);
  border-color: var(--rose-ink);
}
.option input {
  position: absolute;
  opacity: 0;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  cursor: pointer;
}
.option:focus-within {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.option-letter {
  display: grid;
  place-items: center;
  width: 29px;
  height: 29px;
  flex: none;
  background: var(--quiet);
  border: 1px solid var(--line);
  color: var(--muted);
  border-radius: 7px;
  font-weight: 800;
}
.option.selected .option-letter {
  background: var(--accent);
  color: var(--panel);
  border-color: var(--accent);
}
.option-text {
  font-size: 13px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.option-mark svg {
  width: 17px;
  height: 17px;
}
.question-foot {
  margin-top: 13px;
  border-top: 1px solid var(--line);
  padding-top: 12px;
}
.answer-feedback:not(:empty) {
  display: grid;
  gap: 7px;
  margin-top: 10px;
  animation: 0.18s var(--ease) enter-view;
}
.navigator {
  position: sticky;
  top: calc(var(--bar) + 13px);
  min-width: 0;
}
.navigator h2 {
  font-size: 16px;
}
.navigator .progress-line {
  margin: 8px 0;
}
.question-map {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 4px;
  max-height: 243px;
  overflow: auto;
  padding: 3px;
  scrollbar-width: thin;
}
.map-cell {
  position: relative;
  min-height: 32px;
  min-width: 0;
  border: 1px solid var(--line-strong);
  border-radius: 6px;
  background: var(--quiet);
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
  padding: 0;
}
.map-cell:hover {
  background: var(--accent-bg);
}
.map-cell.answered {
  background: var(--accent-bg);
  color: var(--accent);
  border-color: var(--accent);
}
.map-cell[aria-current='step'] {
  color: var(--action-ink);
  background: var(--action);
  border-color: var(--action);
}
.map-cell.flagged::after {
  content: '';
  position: absolute;
  right: 3px;
  top: 3px;
  width: 6px;
  height: 6px;
  border-radius: 2px;
  background: #d39749;
}
.map-legend {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px 8px;
  margin: 7px 0 10px;
  font-size: 9px;
  color: var(--muted);
}
.map-legend span {
  display: flex;
  align-items: center;
  gap: 4px;
}
.map-legend i {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  background: var(--action);
}
.map-legend span:nth-child(2) i {
  background: var(--accent-bg);
  border: 1px solid var(--accent);
}
.map-legend span:nth-child(3) i {
  background: #d39749;
}
.navigator-actions {
  gap: 6px;
  margin-bottom: 7px;
}
.navigator-actions .btn {
  min-height: 36px;
}
.result-hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-radius: 18px;
  background: radial-gradient(ellipse at 84% 10%, #392c67, #18132f 74%);
  color: #f6f1ff;
  padding: 20px 22px;
}
.result-hero h2 {
  color: #f9f6ff;
  margin: 9px 0 5px;
  font-size: clamp(26px, 4vw, 44px);
}
.result-hero p {
  color: #e3daf5;
  font-size: 13px;
  margin-bottom: 12px;
}
.score-ring {
  width: 120px;
  height: 120px;
  position: relative;
  display: grid;
  place-items: center;
  flex: none;
}
.score-ring .ring {
  width: 100%;
  height: 100%;
}
.score-ring .ring-track {
  stroke: #655788;
}
.score-ring .ring-arc {
  stroke: #cbb3ff;
}
.score-ring .ring > div {
  display: none;
}
.score-ring > strong {
  position: absolute;
  font-size: 26px;
  color: #f6f1ff;
}
.review-metrics {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.review-tabs {
  margin-bottom: 9px;
}
.flash-layout {
  grid-template-columns: minmax(0, 1fr) minmax(230px, 0.45fr);
}
.flash-flip {
  background: none;
  border: 0;
  padding: 0;
  text-align: left;
  color: inherit;
  perspective: 1400px;
  display: block;
  width: 100%;
  min-width: 0;
  border-radius: 18px;
}
.flash-core {
  display: grid;
  min-height: 289px;
  transform-style: preserve-3d;
  transition: transform 0.4s var(--ease);
  border-radius: 18px;
}
.flash-flip.flipped .flash-core {
  transform: rotateY(180deg);
}
.flash-face {
  grid-area: 1/1;
  align-self: stretch;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  border-radius: 18px;
  padding: 18px 20px;
  backface-visibility: hidden;
  overflow-wrap: anywhere;
}
.flash-front {
  background: radial-gradient(ellipse at 84% 10%, #392c67, #18132f 74%);
  color: #f6f1ff;
  border: 1px solid #534675;
}
.flash-back {
  background: var(--lilac);
  color: var(--lilac-ink);
  transform: rotateY(180deg);
  border: 1px solid var(--line-strong);
}
.flash-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font: 650 10px var(--mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.flash-label svg,
.flash-hint svg {
  width: 15px;
  height: 15px;
}
.flash-text {
  font-size: clamp(20px, 3vw, 30px);
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: -0.045em;
}
.flash-explanation {
  font-size: 12.5px;
  line-height: 1.53;
}
.flash-hint {
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
}
.flash-aside .day-body {
  padding: 0 1px;
}
.flash-aside .day-body .ring {
  width: 86px;
  height: 86px;
}
.bookmark-layout {
  grid-template-columns: minmax(0, 1.7fr) minmax(225px, 1fr);
}
.bookmark-layout .search-field {
  flex: 1;
}
.bookmark-layout .q-acts {
  flex-direction: column;
}
.bookmark-layout .tab {
  overflow-wrap: anywhere;
  text-align: left;
}
.bookmark-layout .topic-row svg {
  width: 17px;
  height: 17px;
}
.filters {
  margin-bottom: 10px;
}
.performance-layout {
  grid-template-columns: minmax(0, 1.65fr) minmax(225px, 1fr);
}
.trend {
  display: flex;
  gap: 7px;
  min-height: 158px;
  padding: 7px 7px 12px 0;
}
.trend-axis {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  color: var(--muted);
  font: 550 9px var(--mono);
  padding-bottom: 15px;
}
.trend-plot {
  display: grid;
  grid-template-columns: repeat(var(--columns), minmax(0, 1fr));
  align-items: end;
  gap: 4px;
  flex: 1;
  background: repeating-linear-gradient(to top, var(--line) 0 1px, transparent 1px 49.9%);
  position: relative;
  margin-bottom: 15px;
  border-bottom: 1px solid var(--line);
}
.trend-slot {
  height: 100%;
  min-height: 137px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  position: relative;
}
.trend-stick {
  width: min(60%, 49px);
  min-height: 2px;
  height: var(--amount);
  background: linear-gradient(
    0deg,
    var(--accent),
    color-mix(in srgb, var(--accent) 70%, var(--signal))
  );
  border-radius: 5px 5px 0 0;
  transform-origin: bottom;
  animation: bar-in 0.44s var(--ease) both;
}
.trend-key {
  position: absolute;
  bottom: -16px;
  white-space: nowrap;
  color: var(--muted);
  font: 500 8px var(--mono);
}
@keyframes bar-in {
  from {
    transform: scaleY(0);
  }
}
.chart-empty {
  min-height: 160px;
  display: grid;
  place-items: center;
  position: relative;
  isolation: isolate;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--quiet);
}
.chart-empty > div {
  position: absolute;
  inset: 0;
  z-index: -1;
  background: repeating-linear-gradient(0deg, transparent 0 36px, var(--line) 36px 37px);
}
.chart-empty p {
  font-size: 11px;
  background: var(--panel);
  color: var(--muted);
  padding: 6px 9px;
  border-radius: 6px;
}
.chart-empty svg {
  width: 15px;
  height: 15px;
  margin-right: 4px;
}
.data-table {
  font-size: 11px;
}
.data-table summary {
  font-weight: 800;
  cursor: pointer;
  color: var(--accent);
}
.data-table table {
  border-collapse: collapse;
  width: 100%;
  text-align: left;
  margin-top: 6px;
}
.data-table th,
.data-table td {
  padding: 4px;
  border-bottom: 1px solid var(--line);
}
.course-stat,
.topic-stats {
  display: grid;
  gap: 8px;
}
.course-stat:not(:last-child) {
  border-bottom: 1px solid var(--line);
  padding-bottom: 9px;
}
.course-stat .stamp {
  width: 32px;
  height: 32px;
  border-radius: 8px;
}
.course-stat .stamp svg {
  width: 16px;
  height: 16px;
}
.course-stat strong {
  font-size: 12px;
}
.badge-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
}
.badge-card {
  display: grid;
  gap: 6px;
  justify-items: start;
  padding: 11px;
}
.badge-card.unlocked {
  border-color: var(--accent);
}
.badge-card .stamp {
  width: 32px;
  height: 32px;
  border-radius: 8px;
}
.badge-card .stamp svg {
  width: 17px;
  height: 17px;
}
.badge-card h3 {
  font-size: 14px;
}
.notice-list {
  display: grid;
  gap: 7px;
}
.notice-row {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px;
}
.notice-row h3 {
  font-size: 15px;
  margin: 4px 0;
}
.notice-row .stamp {
  width: 34px;
  height: 34px;
  border-radius: 8px;
}
.notice-row .stamp svg {
  width: 17px;
  height: 17px;
}
.switch-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 8px 10px;
  cursor: pointer;
}
.switch-line strong,
.switch-line small {
  display: block;
}
.switch-line strong {
  font-size: 12px;
}
.switch-line small {
  color: var(--muted);
  font-size: 11px;
}
.switch-line input {
  appearance: none;
  width: 38px;
  height: 22px;
  flex: none;
  border: 1px solid var(--line-strong);
  border-radius: 20px;
  background: var(--quiet);
  margin: 0;
  position: relative;
  cursor: pointer;
  transition: background 0.18s;
}
.switch-line input::after {
  content: '';
  position: absolute;
  top: 3px;
  left: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--muted);
  transition: transform 0.2s var(--ease);
}
.switch-line input:checked {
  background: var(--accent);
  border-color: var(--accent);
}
.switch-line input:checked::after {
  background: var(--panel);
  transform: translateX(16px);
}
@media (max-width: 830px) {
  .quiz-layout,
  .flash-layout,
  .bookmark-layout,
  .performance-layout {
    grid-template-columns: 1fr;
  }
  .navigator {
    position: static;
  }
  .question-map {
    grid-template-columns: repeat(10, minmax(0, 1fr));
    max-height: unset;
  }
  .navigator-actions {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .settings-layout,
  .announcements-layout {
    grid-template-columns: 1fr;
  }
}
@media (max-width: 600px) {
  .question-panel {
    padding: 12px;
  }
  .question-map {
    grid-template-columns: repeat(6, minmax(0, 1fr));
  }
  .map-cell {
    min-height: 41px;
  }
  .quiz-controls {
    justify-content: flex-start;
  }
  .review-metrics {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .review-metrics .metric .stamp {
    width: 23px;
    height: 23px;
  }
  .review-metrics .metric .stamp svg {
    width: 13px;
    height: 13px;
  }
  .review-metrics .metric-value {
    font-size: 21px;
  }
  .review-metrics .metric-top {
    font-size: 9.7px;
  }
  .q-row {
    gap: 3px;
  }
  .q-details summary {
    padding: 7px 0 8px 7px;
    gap: 5px;
    flex-wrap: wrap;
  }
  .q-number {
    width: 23px;
    height: 23px;
    font-size: 10px;
  }
  .q-summary strong {
    font-size: 12px;
  }
  .q-summary small {
    font-size: 9px;
  }
  .q-chevron {
    width: 13px;
    height: 13px;
  }
  .q-details summary .chip {
    order: 1;
    margin-left: 28px;
  }
  .q-acts {
    padding: 7px 4px 0 0;
  }
  .q-acts .icon-btn {
    width: 36px;
    height: 36px;
  }
  .bank-controls {
    gap: 7px;
    grid-template-columns: minmax(0, 1fr) minmax(93px, 0.62fr);
    padding: 8px;
  }
  .field .search-input {
    font-size: 12px;
  }
  .flash-core {
    min-height: 245px;
  }
  .flash-face {
    padding: 13px;
  }
  .badge-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .result-hero {
    padding: 13px;
  }
  .score-ring {
    width: 85px;
    height: 85px;
  }
  .score-ring > strong {
    font-size: 19px;
  }
}
@media (max-width: 360px) {
  .bank-controls {
    grid-template-columns: 1fr;
  }
  .trend-key {
    font-size: 7px;
  }
  .q-acts .icon-btn {
    width: 31px;
    height: 34px;
  }
}

@media (max-width: 460px) {
  .trend-slot:nth-child(even):not(:last-child) .trend-key {
    visibility: hidden;
  }
}

/* Session setup: native radios retain arrows, focus and validation. */
.length-controls {
  display: grid;
  gap: 8px;
}
.length-controls legend {
  font-size: 12.5px;
  font-weight: 800;
  margin-bottom: 8px;
}
.count-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 7px;
}
.count-choice {
  position: relative;
  display: grid;
  min-width: 0;
}
.count-choice input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}
.count-choice span {
  position: relative;
  display: grid;
  justify-items: center;
  align-content: center;
  gap: 2px;
  min-height: 66px;
  cursor: pointer;
  background: var(--quiet);
  border: 1px solid var(--line-strong);
  border-radius: 11px;
  transition:
    background 0.16s,
    border-color 0.16s;
}
.count-choice strong {
  font-size: clamp(18px, 1.7vw, 25px);
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -0.05em;
  font-variant-numeric: tabular-nums;
}
.count-choice small {
  font-size: 9.5px;
  color: var(--muted);
}
.count-choice input:checked:not(:disabled) + span {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-bg);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.count-choice input:focus-visible + span {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}
.count-choice input:disabled + span {
  cursor: not-allowed;
  background: var(--panel);
  color: var(--muted);
  border-style: dashed;
  border-color: var(--line-strong);
}
.count-alt:not([hidden]) {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  min-height: 38px;
  font-size: 12px;
}
.count-alt input {
  width: 17px;
  height: 17px;
  margin: 0;
  accent-color: var(--action);
}
.count-choice input:not(:disabled):not(:checked) + span:hover {
  border-color: var(--accent);
}
#pool-status {
  min-height: 2em;
}
#question-title,
.option-text,
.q-summary strong {
  text-align: start;
}
.option-text {
  overflow-wrap: anywhere;
}
:lang(ar) {
  font-family: 'Noto Study Arabic', system-ui, sans-serif;
  line-height: 1.75;
}
.option-text:lang(ar) {
  font-size: 1.1em;
}

/* A local notebook. The editor is opaque and uses a real textarea. */
.notebook-layout {
  display: grid;
  grid-template-columns: minmax(225px, 0.78fr) minmax(0, 2fr);
  gap: 15px;
  align-items: start;
}
.notebook-library,
.notebook-editor {
  display: grid;
  gap: 14px;
  padding: clamp(13px, 2vw, 24px);
  min-width: 0;
}
.notebook-library h2 {
  font-size: clamp(17px, 1.6vw, 23px);
}
.note-list {
  max-height: 380px;
  overflow: auto;
  scrollbar-width: thin;
  padding: 3px;
  margin: -3px;
}
.note-list-count,
.note-list-empty {
  padding: 5px 2px;
}
.note-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 9px;
  padding: 8px;
  min-height: 51px;
  border: 1px solid transparent;
  border-radius: 10px;
}
.note-row:hover {
  background: var(--quiet);
}
.note-row[aria-current] {
  background: var(--accent-bg);
  border-color: var(--line-strong);
}
.note-row svg {
  width: 16px;
  height: 16px;
  color: var(--accent);
}
.note-row strong,
.note-row small {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.note-row small {
  color: var(--muted);
}
.notebook-editor {
  padding: clamp(16px, 2.2vw, 28px);
}
.notebook-editor .note-fields {
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
}
.notebook-editor textarea {
  display: block;
  resize: vertical;
  min-height: min(34vh, 255px);
  padding: 13px;
  width: 100%;
  border: 1px solid var(--line-strong);
  border-radius: 13px;
  background: var(--quiet);
  color: var(--ink);
  font: 500 15px/1.73 var(--font);
}
.notebook-editor textarea::placeholder {
  color: var(--subtle);
}
.notebook-editor textarea:focus {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}
.note-editor-foot .btn {
  min-width: 109px;
}
.notebook-empty {
  position: relative;
  isolation: isolate;
  padding: clamp(20px, 5vw, 58px) clamp(15px, 5vw, 48px);
  min-height: 345px;
  display: grid;
  align-content: center;
  justify-items: start;
  gap: 12px;
  overflow: hidden;
  background: radial-gradient(ellipse at 93% 7%, var(--accent-bg), transparent 68%), var(--panel);
}
.notebook-empty h2 {
  font-size: clamp(28px, 3.35vw, 49px);
  max-width: 19ch;
  letter-spacing: -0.075em;
}
.notebook-empty p {
  color: var(--muted);
  max-width: 41ch;
}
.notebook-motif {
  display: grid;
  place-items: center;
  width: 52px;
  height: 52px;
  border: 1px solid var(--line-strong);
  background: var(--accent-bg);
  color: var(--accent);
  border-radius: 16px;
}
.notebook-motif::before {
  content: '';
  border-radius: 31px;
  border: 1px solid var(--line-strong);
  width: 340px;
  height: 340px;

.note-privacy {

.note-privacy svg {

  height: 15px;

/* Prism: optical accents on navigation and feature surfaces, solid reading panels. */
.topbar,
.mobile-nav {
  background: var(--glass-fallback);
}
@supports (backdrop-filter: blur(1px)) {
  .topbar,
  .mobile-nav {
    background: var(--glass-chrome);
    backdrop-filter: blur(14px) saturate(135%);
  }
}
.topbar {
  border-bottom-color: var(--line);
}
@supports (backdrop-filter: blur(1px)) {
  .hero-link,
  .hero-caption {
    backdrop-filter: blur(9px);
  }
  .hero-inner .hero-link {
    background: #302647de;
  }
  .desk-hero .hero-caption {
    background: #231b3ade;
  }
}
.brand-mark {
  background: linear-gradient(150deg, #e3e1ff, #a294f8 68%, #90b7ff);
  color: #1b1445;
  box-shadow:
    inset 0 1px 1px #fff9,
    0 3px 10px #7e67ee26;
}
.rail {
  background: var(--rail-surface);
  color: var(--rail-ink);
  border-right-color: var(--rail-line);
}
.rail > .brand {
  border-bottom-color: var(--rail-line);
}
.rail .cohort {
  background: var(--rail-hover);
  color: var(--rail-ink);
  border-color: var(--rail-line);
}
.rail .cohort-icon {
  background: var(--rail-active);
  color: var(--rail-active-ink);
}
.brand-label > span,
.rail-link[aria-current='page'] svg {
  color: var(--rail-active-ink);
}
.mobile-brand .brand-label > span {
  color: var(--accent);
}
.rail
  :is(.brand-label small, .cohort small, .rail-group-label, .rail-account small, .account-more) {
  color: var(--rail-muted);
}
.rail .rail-link {
  color: var(--rail-muted);
  border: 1px solid transparent;
}
.rail .rail-link:hover,
.rail-account:hover {
  background: var(--rail-hover);
  color: var(--rail-ink);
}
.rail .rail-link[aria-current='page'] {
  background: var(--rail-active);
  color: var(--rail-ink);
  border-color: var(--rail-active-line);
}
.rail-link::after {
  background: var(--rail-active-ink);
}
.rail-bottom,
html[data-collapsed='true'] .rail-group {
  border-color: var(--rail-line);
}
.rail-account {
  color: var(--rail-ink);
}
.rail-account .avatar {
  background: var(--rail-active);
  color: var(--rail-active-ink);
}
.rail-tip {
  background: var(--panel);
  color: var(--ink);
  border-color: var(--line-strong);
}
#notice-dot {
  background: #a993ff;
}
#overlay {
  box-shadow: 0 26px 105px #08071366;
}
#overlay::backdrop {
  background: #0b0a1a9e;
}
.toast {
  background: #25213d;
  color: #f9f6ff;
  border-color: #695b9a;
  box-shadow: 0 12px 34px #08051a66;
}
.toast svg {
  color: #c8b9ff;

.dash-head {
  margin-bottom: 23px;
}
.dash-head h1 {
  font-size: clamp(30px, 3.25vw, 48px);
  letter-spacing: -0.07em;
}
.dash-head p {
  margin-top: 8px;

}
.dash-kicker i {
  background: var(--accent);

.dash-date {

  background: radial-gradient(ellipse at 83% 98%, #3b306c 0%, transparent 65%), #151129;
  box-shadow:
    inset 0 1px 0 #c7bbff55,
    0 12px 30px #29176823;

.desk-hero::before {
  background-image: radial-gradient(circle, #d9cfff32 1px, transparent 1px);
  background-size: 19px 19px;
  mask-image: linear-gradient(124deg, #000 3%, #0004 35%, transparent 56%);
}
.hero-art {
  inset: -8% -2% -9% auto;
  width: 66%;
  height: auto;
  background-size: contain;
  background-position: 100% 50%;
  mask-image: radial-gradient(ellipse at 63% 49%, black 47%, #000d 54%, transparent 74%);

  background:

.hero-glint {
  position: absolute;
  z-index: -1;
  inset: 0;
  pointer-events: none;

    #c7a9ff26,
    transparent 67%
  );
}
.hero-inner {
  padding: 27px clamp(21px, 3vw, 41px) 30px;
  max-width: 560px;
  z-index: 0;
}
.hero-tag {
  border-radius: 99px;
  color: #eee8ff;
  background: #30264b;
  border-color: #8c78bf9a;
  padding: 5px 9px;
  font-size: 10px;
}
.hero-tag svg {
  color: #d1c1ff;
}
.hero-inner h2 {
  font-family: var(--font);
  font-size: clamp(48px, 5.6vw, 87px);
  line-height: 0.96;
  letter-spacing: -0.094em;
  color: #fbf9ff;

.hero-inner h2 em {
  font: inherit;

    color: transparent;
  }
}
.hero-inner p {
  color: #ded8ef;
  font-size: 14px;
  max-width: 35ch;
  margin: 13px 0 19px;
}
.hero-inner .btn {
  min-height: 43px;
  padding-inline: 13px;
}
.hero-link {
  color: #f1ebff;
  background: #302647;
  border-color: #8c78bf9a;
}
.hero-caption {
  color: #e5def9;
  background: #231b3a;
  border-color: #ae9bdd73;
  border-radius: 99px;
  font-size: 9px;
  padding: 5px 8px;
  right: 15px;
  bottom: 13px;
}
.hero-caption i {
  background: #c4b1fb;
}
.hero-caption span {
  color: #d7caff;
}

.day-card {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border-radius: 23px;
  background: radial-gradient(ellipse at 70% 9%, var(--accent-bg), transparent 73%), var(--panel);
  gap: 9px;
  padding: clamp(13px, 1.6vw, 23px);
  justify-content: space-between;
}
.day-card::before {
  content: '';
  pointer-events: none;
  position: absolute;
  z-index: -1;
  inset: 0;
  background: linear-gradient(145deg, var(--glass-sheen), transparent 47%);
}
.day-card .icon-btn {
  width: 38px;
  height: 38px;
}
.day-card .icon-btn svg {
  width: 17px;
  height: 17px;
}
.day-card h2 {
  font-size: clamp(22px, 2.15vw, 30px);
}
.day-body {
  gap: 11px;
}
.day-body > div:last-child strong {
  font-size: 13px;
}
.day-body > div:last-child small {
  font-size: 11.5px;
}
.day-card .ring {
  width: clamp(72px, 7vw, 104px);
  height: clamp(72px, 7vw, 104px);
}
.week {
  gap: 5px;
}
.day-foot {
  flex-wrap: wrap;
}
.metrics {
  gap: 11px;
  margin-block: 16px 26px;
}
.metric {
  background: var(--panel);
  padding: 13px;
}
.metric-top {
  font-size: 12px;
}
.metric-value {
  letter-spacing: -0.085em;
}
.metric p {
  font-size: 11px;
}
.shelf-section {
  margin-top: 0;
}
.activity-zone {
  margin-top: 25px;
}
.activity-zone .dash-extras {
  margin-top: 0;
}
.activity-zone .day-stack {
  display: grid;
  gap: 10px;
}
.activity-zone .day-stack .panel {
  min-width: 0;
}
.activity-zone .section-title {
  align-items: flex-start;
}
.activity-zone .notebook-teaser {
  margin-top: 10px;
}
.course-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 13px;
}
.course-grid .course-card:focus-within {
  border-color: var(--accent);
}
.course-banner {
  min-height: 107px;
  padding: 14px;
  background-image:
    radial-gradient(
      circle at 75% 29%,
      color-mix(in srgb, currentColor 15%, transparent),
      transparent 58%

    radial-gradient(circle, color-mix(in srgb, currentColor 22%, transparent) 1px, transparent 1px);
  background-size:
    100% 100%,
    17px 17px;
}
.course-compact .course-banner {
  min-height: 83px;
}
.course-banner .stamp {
  border-radius: 12px;
}
.course-ornament {
  right: 17%;
  top: 28%;
  box-shadow:
    0 0 0 9px color-mix(in srgb, currentColor 8%, transparent),
    0 0 0 20px color-mix(in srgb, currentColor 6%, transparent),
    0 0 0 32px color-mix(in srgb, currentColor 4%, transparent);

  font-size: 10.5px;
}

  display: grid;
  gap: 7px;
}

  border: 1px solid var(--line);
  border-radius: 13px;
}

  padding-block: 5px;
  font-weight: 800;

  font: 650 10.5px var(--mono);

  margin-inline-start: 8px;
}

  padding-block: 3px 9px;

  max-width: 90ch;
}
.result-hero,

  background: radial-gradient(ellipse at 84% 10%, #392c67, #18132f 74%);
  color: #f6f1ff;
  border-color: #534675;
}
.result-hero h2,
.flash-front .flash-text {
  color: #f9f6ff;
}
.result-hero p,
.flash-front .flash-hint {
  color: #e3daf5;
}
.result-hero .ring-track {
  stroke: #655788;
}
.result-hero .ring-arc {
  stroke: #cbb3ff;
}
.result-hero .score-ring > strong {
  color: #f6efff;
}

@media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
  .hero-art {
    transform: translate3d(var(--drift-x, 0px), var(--drift-y, 0px), 0) rotate(var(--drift-r, 0deg));
    transition: transform 0.53s var(--ease);
  }
  .pointer-active .hero-art {
    transition-duration: 0.26s;
  }
  .course-card,
  .pick-card {
    transition:
      border-color 0.22s,
      transform 0.27s var(--ease);
  }
  .course-card:hover,
  .pick-card:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
  }
}
.revealed {
  animation: section-arrival 0.46s var(--ease) both;
}
@keyframes section-arrival {
  from {
    transform: translateY(12px);
    opacity: 0.68;
  }
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

  .count-grid {
    grid-template-columns: repeat(3, minmax(0, 1fr));

  .activity-zone {
    grid-template-columns: minmax(0, 1.45fr) minmax(220px, 1fr);

  .metrics {
    gap: 8px;

    padding: 11px;
  }

    font-size: 11px;
  }

  .activity-zone,
  .notebook-layout {
    grid-template-columns: minmax(0, 1fr);

    grid-template-columns: repeat(auto-fit, minmax(min(100%, 198px), 1fr));

  .hero-inner {
    padding: 25px 22px;
  }
  .hero-inner h2 {
    font-size: clamp(46px, 9vw, 68px);

  .dash-head {
    margin-bottom: 16px;
  }
  .note-list {
    max-height: 210px;
  }
}
@media (max-width: 530px) {
  .hero-grid {
    gap: 10px;
  }
  .dash-date {
    font-size: 10px;
    padding: 5px 8px;
  }
  .desk-hero {
    min-height: clamp(326px, 87vw, 401px);
    border-radius: 18px;
    align-items: start;
  }
  .hero-inner {
    padding: 19px 15px 126px;
  }
  .hero-inner h2 {
    margin-top: 12px;
  }
  .hero-inner p {
    font-size: 12.5px;
    margin: 10px 0 13px;
  }
  .hero-inner .btn {
    min-height: 43px;
    padding-inline: 8px;
  }
  .hero-art {
    inset: auto -10px -12% auto;
    height: 70%;
    width: 93%;
    background-size: contain;
    -webkit-mask-image: radial-gradient(ellipse at 63% 51%, black 39%, #000b 51%, transparent 72%);
    mask-image: radial-gradient(ellipse at 63% 51%, black 39%, #000b 51%, transparent 72%);
  }
  .desk-hero::after {
    background:
      linear-gradient(180deg, #151129 5%, #151129b0 46%, transparent 65%),
      linear-gradient(90deg, #15112999, transparent 60%);
  }
  .hero-caption {
    font-size: 8.5px;
    right: 10px;
    bottom: 9px;
  }
  .day-card {
    border-radius: 18px;
  }
  .notebook-editor .note-fields {
    grid-template-columns: minmax(0, 1fr);
  }
  .notebook-layout {
    gap: 10px;
  }
  .notebook-empty {
    min-height: 255px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .revealed,
  .hero-art {
    animation: none;
    transition: none;
    transform: none;
  }
}

@media (max-width: 425px) {
  .bento > .day-card {
    grid-template-columns: minmax(0, 1fr);
    gap: 8px;
  }
  .day-card .week {
    margin-block: 0;
  }
}

  { id: 13, topic: 'planning', text: 'What normally happens to working capital needs if a business gives its customers more time to pay, all else being equal?',

const REVISIONS = (() => {
  const levels = { f: 'foundation', a: 'applied', c: 'challenge' };
  const rows = (text, source, offset, citation) =>
    text
      .trim()
      .split('\n')
      .map((line, index) => {
        const fields = line.split('|');
        if (fields.length !== 10) throw new Error(`Invalid ${source} row ${index + 1}`);
        const [item, marker, topic, difficulty, textOfQuestion, correct, d1, d2, d3, explanation] =
          fields;
        const number = Number(item);
        const answer = (number - 1) % 4;
        const options = [d1, d2, d3];
        options.splice(answer, 0, correct);
        return {
          id: offset + number,
          number,
          topic,
          level: levels[difficulty],
          text: textOfQuestion,
          options,
          answer,
          explanation,
          origin: citation(Number(marker)),
          sourceType: 'revision',
          sourceTitle: source,
        };
      })
      .sort((a, b) => a.number - b.number);
  return {
    business: rows(
      BUSINESS_REVISION_ROWS,
      'Intro Entrepreneurship',
      1000,
      (n) => `Intro Entrepreneurship · PDF p. ${n}`
    ),
    arabic: rows(
      ARABIC_REVISION_ROWS,
      'Basic Arabic Conversation II',
      2000,
      (n) => `Basic Arabic Conversation II · PDF p. ${n}`
    ),
  };
})();

    return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  };
  const safeRef = (value) => {
    try {
      const url = new URL(value);
      return url.protocol === 'https:' &&
        !url.username &&
        !url.password &&
        ['quran.com', 'sunnah.com'].includes(url.hostname)
        ? url.href
        : '';
    } catch {
      return '';
    }
  };
  return {
    $,
    $$,
    esc,
    text,
    norm,
    words,
    match,
    int,
    finiteTime,
    token,
    uid,
    unique,
    shuffle,
    pad,
    plural,
    percent,
    key,
    date,
    longDate,
    dayAt,
    dayOffset,
    validDay,
    weekday,
    initials,
    reduce,
    clock,
    safeRef,
  };
})();
